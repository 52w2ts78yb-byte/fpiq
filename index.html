'II.4':{c:'Attribution: how does the person explain what happened to them? Internal vs. external locus, psychological vs. medical framing, blame assignment, narrative coherence.',p:['In your own understanding, why do you think this happened?','Do you think this is primarily something psychological, something medical, or something situational?','Is there anyone or anything you hold responsible for where you are right now?'],am:'Attribution style predicts treatment engagement and outcome. External attribution ("the Air Force did this to me") carries different clinical and aeromedical implications than internal attribution with insight.'},
'II.5':{c:'Treatment history: all mental health treatment — psychotherapy, medication, hospitalizations, intensive programs. Provider names, duration, modality, response, and reason for termination.',p:['Walk me through all the mental health treatment you\'ve had — therapy, medication, anything.','Who prescribed your medications, and what was the clinical indication?','Have you ever been hospitalized for mental health reasons, or been in a partial hospital or intensive outpatient program?'],am:'Prior treatment history establishes: severity of illness (higher level of care = more severe), response to treatment (predicts future response), and compliance (predicts waiver aftercare compliance). Gaps in treatment engagement are clinically significant.'},
'II.6':{c:'Functional impact: how has the presenting concern affected functioning across domains — work, flying, relationships, health, recreation, and self-care.',p:['How much has this been affecting your day-to-day functioning — work, relationships, home life?','Has your performance at work changed? Have supervisors or peers noticed anything?','Has flying been affected — performance, confidence, enjoyment, or your sense of safety?'],am:'Functional impact in aviation is the primary aeromedical question. Assess cockpit performance specifically — instrument scan, communication, decision-making, fatigue management.'},
'PMH.1':{c:'Delivery, neonatal, and developmental history: complications during pregnancy or delivery, neonatal course, developmental milestones. Relevant to neurodevelopmental diagnoses.',p:['Do you know anything about your birth or early infancy — any complications, early health problems?','Were there any concerns about your development as a young child — walking, talking, milestones?'],am:''},
'PMH.2':{c:'Childhood illnesses and hospitalizations: significant medical events in childhood. Meningitis, encephalitis, febrile seizures, head trauma, loss of consciousness.',p:['Were there any significant illnesses, hospitalizations, or surgeries when you were growing up?','Any seizures, serious infections, or extended hospital stays as a child?'],am:'Childhood CNS infections (meningitis, encephalitis) and febrile seizures have long-term neurological implications relevant to aeromedical evaluation.'},
'PMH.3':{c:'Adult medical conditions — active and past: all significant medical diagnoses across the lifespan. Chronic conditions, acute events, resolved conditions, and current status.',p:['Walk me through your significant medical history as an adult — any chronic conditions, major illnesses, or significant diagnoses?','Any cardiac, neurological, endocrine, or pulmonary conditions?','Any conditions that have been treated and resolved?'],am:'Multiple medical comorbidities compound aeromedical risk and may interact with psychiatric diagnoses and medications. Cardiac and neurological conditions are of particular aeromedical relevance.'},
'PMH.4':{c:'Surgical history: all surgical procedures including anesthesia, recovery course, and any complications.',p:['Have you had any surgeries? Walk me through each one.','Any anesthetic complications or prolonged recoveries?'],am:'Some surgical procedures (cardiac, neurological, ENT) have direct aeromedical implications. Anesthetic complications may suggest underlying physiological vulnerabilities.'},
'PMH.5':{c:'Head trauma: ALL incidents involving head impact, loss of consciousness, post-traumatic amnesia, or altered mental status. Sports, accidents, falls, blast, training.',p:['Walk me through every head injury you can remember — sports, accidents, falls, anything involving your head.','For each: did you lose consciousness? How long? Any amnesia around it? Headaches, confusion, or symptoms afterward?','How many total incidents would you estimate?'],am:'Cumulative TBI burden is aeromedically significant. Each incident must be individually documented. Contact sports, blast exposure, and training incidents must all be captured. This is a mandatory item for all evaluations.'},
'PMH.6':{c:'Loss of consciousness: all episodes of loss of consciousness regardless of cause — syncope, hypoglycemia, seizure, arrhythmia, hypoxia, alcohol, trauma.',p:['Have you ever lost consciousness — blacked out, fainted, or been knocked out?','For each episode: what were the circumstances? How long were you out? What happened before and after?','Were the circumstances fully explained medically?'],am:'Any unexplained loss of consciousness is disqualifying pending workup. Each episode must be characterized by mechanism, duration, and medical explanation. Recurrence risk is the key aeromedical question.'},
'PMH.7':{c:'Hypoxic and physiologic exposures: altitude chamber events, G-LOC history, hypoxia in flight, sudden decompression, toxic exposures, underwater submersion.',p:['Have you ever had a G-LOC — loss of consciousness under G forces?','Have you had any hypoxia events — in the altitude chamber or in flight?','Any sudden decompression events, or toxic exposures in aviation?'],am:'Each hypoxic event must be individually documented. Repeated G-LOC events suggest potential for future incapacitation and require specific aeromedical evaluation. Document G-onset LOC vs. G-induced LOC separately.'},
'PMH.8':{c:'Current medications and dosages: ALL medications — prescription, OTC, supplements, herbal, vitamins. Prescribing provider, indication, dose, duration, and recent changes.',p:['What medications are you currently taking — prescription, over-the-counter, supplements, vitamins, anything?','Who prescribed each one, and what is the indication?','Any recent changes in medications — dose adjustments, additions, or discontinuations?'],am:'Every medication must be cross-referenced against the aeromedically approved list. Any psychotropic medication not on the approved list is disqualifying until reviewed. Supplements and herbals can have aeromedically significant effects (stimulants, sedatives, cardiac effects).'},
'PMH.9':{c:'Allergies and adverse drug reactions: true allergies vs. intolerances vs. adverse effects. Specific reactions and medical consequences.',p:['Do you have any medication allergies? What happens when you take them?','Have you had any adverse reactions to medications that were not allergies — side effects that caused you to stop?'],am:''},
'PMH.10':{c:'Physical limitations and barriers: any current physical limitations affecting flying duties, occupational performance, or daily functioning.',p:['Are there any physical limitations — pain, weakness, reduced range of motion, stamina — that affect your ability to do your job?','Is there anything physical that limits what you can do in the cockpit specifically?'],am:'Physical limitations that affect flying duties must be documented and cross-referenced with the Medical Standards Directory.'},
'XX.ssri':{c:'SSRIs and SNRIs: aeromedically approved antidepressants (sertraline ≤200mg, fluoxetine ≤80mg, citalopram ≤40mg, escitalopram ≤20mg, bupropion SR/XL ≤400/450mg). Side effect profile relevant to aviation.',p:['What SSRI or antidepressant is being taken, at what dose, prescribed by whom?','How long at current dose? Any dose changes in the past year?','Any side effects — activation, sedation, sexual side effects, cognitive effects?','Is this being taken as approved monotherapy, or is there another antidepressant also being taken?'],am:'Monotherapy requirement: only ONE approved antidepressant at a time. Dual therapy is not aeromedically approved. Bupropion IR (immediate release) is NOT approved — only SR and XL formulations.'},
'XX.tca':{c:'Tricyclic antidepressants and atypical antidepressants (mirtazapine, trazodone, nefazodone): not aeromedically approved. Significant sedation, anticholinergic effects, cardiac effects.',p:['Is the person taking any tricyclic antidepressant or atypical antidepressant (mirtazapine, trazodone)?','What is the indication, dose, and prescribing provider?'],am:'TCAs, mirtazapine, and trazodone are NOT aeromedically approved. They produce sedation, cognitive slowing, and orthostatic hypotension — direct cockpit safety concerns.'},
'XX.ms':{c:'Mood stabilizers: lithium, valproate, lamotrigine, carbamazepine. Not aeromedically approved for bipolar disorder — treatment of bipolar is incompatible with flying duties. Some have uses for other conditions.',p:['Is the person taking any mood stabilizer — lithium, Depakote, Lamictal, Tegretol?','What is the indication — bipolar, seizures, migraine, or other?','What are current blood levels if applicable?'],am:'Mood stabilizers for bipolar disorder are not aeromedically approved — bipolar disorder is not waiverable. Lamotrigine for seizure disorder may have a separate waiver pathway through neurology. The indication matters critically.'},
'XX.ap':{c:'Antipsychotics: first and second generation. Not aeromedically approved. EPS, tardive dyskinesia, sedation, metabolic effects, cognitive slowing — all directly incompatible with flying duties.',p:['Is the person taking any antipsychotic medication — Risperdal, Seroquel, Abilify, Zyprexa, Haldol, or similar?','What is the indication — psychosis, bipolar, augmentation, sleep, or other?'],am:'Antipsychotics in any dose for any indication are not aeromedically approved. The indication determines the primary disqualifying diagnosis.'},
'XX.benzo':{c:'Benzodiazepines and Z-drugs (zolpidem, zaleplon, eszopiclone): not aeromedically approved. Sedation, cognitive impairment, tolerance, dependence, and withdrawal risk.',p:['Is the person taking any benzodiazepine — Xanax, Valium, Klonopin, Ativan, Librium?','Any Z-drugs — Ambien, Lunesta, Sonata — for sleep?','How long, at what dose, and how frequently?'],am:'Benzodiazepines and Z-drugs are not aeromedically approved. They produce sedation and cognitive slowing with next-day impairment. Z-drug use suggests a sleep disorder that is itself disqualifying. Physiological dependence requires medically supervised taper.'},
'XX.stim':{c:'Stimulants and non-stimulant ADHD medications: methylphenidate, amphetamine salts, atomoxetine, viloxazine, guanfacine, clonidine. No stimulant or ADHD medication is aeromedically approved.',p:['Is the person taking any stimulant — Adderall, Ritalin, Vyvanse, Concerta?','Any non-stimulant ADHD medication — Strattera, Qelbree, Intuniv?','When was the last dose? What is the current dose and duration of use?'],am:'No stimulant or non-stimulant ADHD medication is aeromedically approved. ACS has not recommended any waiver for ADHD on medication. Minimum 12 months off ALL ADHD medication with demonstrated stability required before waiver consideration.'},
'XX.other':{c:'Other aeromedically relevant agents: antihistamines (sedating), opioids, muscle relaxants, antimalarials, weight loss medications, hormone therapies, isotretinoin, beta blockers.',p:['Any other medications not yet discussed — pain medications, allergy medications, hormones, weight loss drugs?','Any antimalarial medications currently or recently?','Any herbal or supplement products that could have stimulant or sedative effects?'],am:'Sedating antihistamines (diphenhydramine, hydroxyzine) are not approved. Antimalarials (mefloquine) have significant psychiatric side effects. Isotretinoin has documented mood effects. Each must be individually evaluated against current aeromedical guidance.'},
'FmHx.1':{c:'Family psychiatric history: detailed psychiatric diagnoses in first-degree relatives (parents, siblings, children) and second-degree relatives. Includes diagnosis, treatment, hospitalization, and functional outcome.',p:['Has anyone in your immediate family — parents, siblings, children — had any mental health diagnosis or received mental health treatment?','Any history of depression, anxiety, bipolar disorder, schizophrenia, or other psychiatric conditions in the family?','How were they affected, and what happened with treatment?'],am:'Family psychiatric history is a critical genetic and environmental risk factor. Bipolar disorder in a first-degree relative significantly increases risk in the aviator. This is directly relevant to differential diagnosis.'},
'FmHx.2':{c:'Suicide and self-harm in family: completed suicides, attempts, and non-suicidal self-injury in the family. The impact of these events on the aviator.',p:['Has anyone in your family ever attempted or died by suicide?','Has anyone engaged in self-harm?','How did you learn about it, how old were you, and how did it affect you?'],am:'Family history of completed suicide significantly elevates risk in the aviator. The aviator\'s exposure to and processing of this loss is clinically important.'},
'FmHx.3':{c:'Cardiovascular and cerebrovascular family history: premature coronary artery disease, stroke, arrhythmia, sudden cardiac death, hypertension.',p:['Any heart disease in the family — heart attacks, strokes, arrhythmias, sudden death?','Any family members with early cardiovascular disease (before age 55 in men, 65 in women)?'],am:'Family cardiovascular history is relevant to the aviator\'s own risk profile, G-tolerance, and long-term fitness for flying duties.'},
'FmHx.4':{c:'Neurological disorders in family: epilepsy, migraine, MS, Parkinson\'s, ALS, Huntington\'s, early dementia.',p:['Any neurological conditions in the family — epilepsy, MS, Parkinson\'s, ALS, dementia?','Any family members with early-onset dementia or movement disorders?'],am:'Heritable neurological conditions are relevant to the aviator\'s own risk. Huntington\'s disease and familial early-onset dementias have direct aeromedical implications when family history is positive.'},
'FmHx.5':{c:'Metabolic and endocrine conditions in family: diabetes, thyroid disorders, metabolic syndrome, obesity.',p:['Any diabetes, thyroid problems, or metabolic conditions in the family?'],am:''},
'FmHx.6':{c:'Cancer and major illness in family: significant cancer history, autoimmune conditions, or major systemic illness.',p:['Any significant cancer or major illness in the family?','Any conditions that seem to run in the family that we haven\'t covered?'],am:''},
'FmHx.7':{c:'Substance use disorders in family: alcohol use disorder, drug use disorders, gambling disorder, or other addictive disorders in first and second-degree relatives.',p:['Has alcohol or substance use been a problem in your family — parents, siblings, grandparents?','Was there a parent or family member whose drinking or drug use significantly affected family functioning?'],am:'Family history of AUD is one of the strongest predictors of AUD in the aviator. This is directly relevant to all alcohol-related referral questions and risk assessment.'},
'FmHx.8':{c:'Heritable aeromedical conditions: conditions with Mendelian inheritance or strong familial clustering that have direct aeromedical implications. Includes Long QT syndrome, HCM, Marfan syndrome, color vision defects.',p:['Are there any conditions in the family that have been specifically flagged as relevant to military or aviation service?','Any family members with cardiac arrhythmias, sudden death, or heart conditions at a young age?'],am:'Heritable conditions affecting cardiac conduction, connective tissue, vision, or cognitive function have direct aeromedical implications and may require the aviator to undergo specific testing.'},
'SH.1':{c:'Tobacco and nicotine use: cigarettes, smokeless tobacco, vaping, nicotine pouches. Onset, amount, duration, and cessation history.',p:['Do you use tobacco or nicotine in any form — cigarettes, chewing tobacco, vaping, pouches?','How much and how long?','Have you tried to quit? What happened?'],am:'Nicotine withdrawal during cessation attempts can impair concentration and mood — relevant to cockpit performance. Bupropion SR/XL is aeromedically approved for smoking cessation.'},
'SH.2':{c:'Caffeine and energy drink intake: daily caffeine consumption (coffee, tea, energy drinks, pre-workouts). Quantity, timing, withdrawal symptoms.',p:['How much caffeine do you consume daily — coffee, energy drinks, pre-workouts, anything else?','Do you use energy drinks specifically — what brands and how many?','Do you get headaches or feel sluggish when you miss your usual caffeine?'],am:'High caffeine and energy drink consumption is extremely common in aviation populations and can produce anxiety symptoms, palpitations, sleep disruption, and tremor that mimic or exacerbate psychiatric disorders. This must be characterized before assigning any anxiety diagnosis.'},
'SH.3':{c:'Exercise: type, frequency, intensity, duration. Obsessive or compulsive exercise patterns. Changes in exercise pattern associated with mood or symptoms.',p:['Tell me about your exercise routine — what do you do, how often, how intense?','Has your exercise pattern changed recently?','Do you ever feel compelled to exercise even when injured or exhausted?'],am:'Exercise pattern changes are sensitive indicators of mood change — decreased exercise often accompanies depression, increased compulsive exercise may accompany eating disorder or anxiety. Exercise level also affects physiology relevant to G-tolerance.'},
'SH.4':{c:'Nutrition and diet: dietary patterns, restricted eating, disordered eating behaviors, significant weight changes, meal regularity.',p:['Tell me about your eating habits — what does a typical day of eating look like?','Are there foods or food groups you avoid or restrict?','How regular are your meals — are you eating three times a day, skipping meals?'],am:''},
'SH.5':{c:'Weight history and body image: lifetime weight trajectory, significant fluctuations, relationship to body image and self-esteem. Relevant to eating disorder screening.',p:['How has your weight changed over your life — any significant gains or losses?','How do you feel about your current weight and body?','Is weight or body image a significant concern for you?'],am:''},
'SH.6':{c:'Sleep schedule and hygiene: typical sleep timing, duration, quality, regularity, shift work, and sleep hygiene practices.',p:['What does your sleep look like on a typical weeknight — bedtime, wake time, how many hours?','How consistent is that schedule across the week, and does it change on weekends?','Do you have a wind-down routine, or do you tend to go to bed immediately after screens or work?'],am:'Sleep duration, quality, and schedule consistency have direct aeromedical implications. Irregular sleep timing disrupts circadian rhythm and affects daytime alertness in shift-work and rotating-schedule aviators.'},
'SH.7':{c:'High-risk leisure activities: activities with elevated injury risk or legal implication — motorcycling, extreme sports, hunting, combat sports, skydiving, alcohol-fueled activities.',p:['What do you do in your spare time — any activities that involve significant physical risk?','Do you ride a motorcycle? Any extreme sports, combat sports, or similar?','Do you engage in any activities that involve alcohol as a central component?'],am:'High-risk leisure activities are relevant both medically (injury risk, G-tolerance implications) and as character indicators — an aviator whose off-duty risk tolerance significantly exceeds the norm warrants evaluation for impulsivity, thrill-seeking, and judgment.'},
'SH.8':{c:'Religious and spiritual practices: religious affiliation, importance of faith in daily life, spiritual resources and community. How faith relates to coping and meaning-making.',p:['Is religion or spirituality an important part of your life?','Do you have a faith community you participate in?','How does your faith or spiritual life factor into how you cope with difficult situations?'],am:'Religious and spiritual practices are often significant protective factors and sources of resilience. Conflict between faith and military duties or mental health treatment is relevant to the formulation.'},
'SH.9':{c:'Cultural background and influences: ethnic, national, regional, and subcultural identity. How culture shapes symptom expression, help-seeking, and the evaluation relationship.',p:['How do you think about your cultural background — where your family is from, how you were raised culturally?','How does your background influence how you think about mental health, seeking help, or this evaluation?','Are there ways your cultural background shapes how you express or understand what you\'ve been going through?'],am:''},
'RoS.1':{c:'Neurological review: headaches (frequency, severity, location, triggers, associated symptoms), dizziness (type: vertigo vs. lightheadedness), seizures, tremor, weakness, numbness, coordination.',p:['Do you have headaches? Tell me about them — how often, how severe, what they feel like, any triggers.','Have you had episodes of dizziness — a spinning sensation, or just feeling lightheaded?','Any tremor, weakness, numbness, tingling, or coordination problems?'],am:'Migraines with aura, vertigo, and tremor all have direct aeromedical implications. Spatial disorientation risk assessment depends on vestibular and proprioceptive function.'},
'RoS.2':{c:'Cardiovascular review: palpitations, chest pain, dyspnea on exertion, syncope, pre-syncope, exercise intolerance, ankle swelling.',p:['Have you had palpitations — heart pounding, racing, or skipping beats?','Any chest pain or tightness?','Have you ever fainted or felt like you were about to faint?'],am:'Cardiac symptoms require full cardiovascular workup before waiver consideration. G-tolerance and ejection safety depend on cardiac function.'},
'RoS.3':{c:'Pulmonary and ENT review: dyspnea at rest or exertion, chronic cough, wheezing, hearing loss, tinnitus, voice changes, sinus problems.',p:['Any breathing problems — shortness of breath, chronic cough, wheezing?','Any hearing changes — loss, ringing, or sensitivity to sound?','Any chronic sinus or ENT issues?'],am:'Hearing loss and tinnitus are common in military aviation from noise exposure and have direct aeromedical implications. Eustachian tube dysfunction affects pressurization tolerance.'},
'RoS.4':{c:'Gastrointestinal review: appetite changes, nausea, abdominal pain, bowel changes, reflux, IBS symptoms.',p:['Any nausea, stomach pain, or digestive problems?','Has your appetite changed significantly?','Any reflux or chronic GI issues?'],am:'GI symptoms are a common somatic expression of anxiety and depression. Reflux and IBS are highly prevalent in stressed aviation populations.'},
'RoS.5':{c:'Musculoskeletal review: pain (location, duration, functional impact), weakness, joint problems, gait or coordination concerns.',p:['Any significant pain — where, how long, how much does it affect what you can do?','Any joint problems, weakness, or coordination difficulties?','Does pain affect your ability to fly or perform your duties?'],am:'Chronic pain has direct aeromedical implications through effects on alertness, concentration, and medication use. Neck and back pain affect ejection safety and cockpit environment tolerance.'},
'RoS.6':{c:'Dermatological and autonomic review: sweating (quantity, triggers, situational), temperature regulation, flushing, skin conditions.',p:['Any significant sweating problems — excessively sweating, at rest, or in situations that don\'t warrant it?','Any skin conditions that are persistent or functionally significant?'],am:'Hyperhidrosis can be a physiological correlate of anxiety. Autonomic dysregulation may affect G-tolerance.'},
'RoS.7':{c:'Endocrine and metabolic review: diabetes, thyroid dysfunction, adrenal conditions, fatigue, heat/cold intolerance, weight changes.',p:['Has there been any concern about your thyroid — have you been tested?','Any symptoms of blood sugar problems — episodes of shakiness, sweating, confusion with hunger?','Any unusual fatigue, heat or cold intolerance, or significant unexplained weight change?'],am:'Thyroid dysfunction and hypoglycemia can produce psychiatric symptoms (anxiety, mood instability, cognitive changes) and must be excluded before assigning psychiatric diagnoses.'},
'RoS.8':{c:'Genitourinary and reproductive review: for clinical completeness and as a screen for medication side effects and hormonal contributors to mood.',p:['Any genitourinary symptoms — urinary frequency, pain, or changes?','For women: any significant menstrual changes or perimenopausal symptoms that have affected mood or functioning?'],am:'Hormonal fluctuations associated with menstrual cycle, perimenopause, or testosterone changes can contribute significantly to mood instability and must be characterized.'},
'RoS.9':{c:'Sensory review: visual changes (acuity, color vision, visual field), hearing, taste, smell. Both persistent and episodic.',p:['Any visual changes — acuity, color, peripheral vision, episodes of visual disturbance?','Any changes in hearing, smell, or taste?'],am:'Visual and hearing changes have direct aeromedical implications. Color vision defects affect certain flying assignments. Episodic visual disturbances may indicate migraine with aura or TIA.'},
'RoS.10':{c:'Psychosomatic symptom burden: total burden of unexplained somatic symptoms across organ systems. Pattern of multiple unexplained symptoms is clinically significant.',p:['Looking across all of these systems — how many of them involve symptoms that haven\'t had a clear medical explanation?','Has there been a pattern of seeing doctors for concerns that end up not having a clear physical cause?'],am:'A high burden of medically unexplained symptoms across multiple organ systems suggests somatic symptom disorder and is relevant to both diagnosis and prognosis.'},
'III.1':{c:'Prenatal and perinatal history: maternal health during pregnancy, birth complications, neonatal course, early health. Relevant primarily to neurodevelopmental diagnoses.',p:['Do you know anything about your birth — any complications during your mother\'s pregnancy or during delivery?','Were there any concerns in the early weeks of your life?'],am:''},
'III.2':{c:'Early development and attachment: developmental milestones, early temperament, quality of early attachment relationships. Theory: secure vs. insecure attachment (anxious, avoidant, disorganized) and its long-term effects on affect regulation, relationships, and stress tolerance.',p:['How would you describe yourself as a young child — your temperament, how easy or difficult you were?','Do you have a sense of how close and secure your relationship with your parents was in early childhood?','Were your needs generally met reliably, or was there unpredictability or neglect in that early period?'],am:'Attachment theory: early secure attachment predicts better affect regulation, more stable relationships, and more effective stress coping. Insecure attachment (particularly disorganized, associated with abusive or chaotic caregiving) predicts personality pathology, affect dysregulation, and interpersonal instability.'},
'III.3':{c:'Childhood emotional and behavioral patterns: emotional reactivity in childhood, behavioral difficulties, conduct problems, anxiety or depression in childhood, peer relationships, family role.',p:['What were you like emotionally as a child — anxious, easy-going, reactive, difficult to manage?','Were there behavioral problems in childhood — fights, rule-breaking, school difficulties?','What role did you play in your family — the responsible one, the rebel, the one who held things together?'],am:'Childhood conduct problems (especially before age 15) are required for an ASPD diagnosis. Childhood anxiety predicts adult anxiety disorders. The family role taken on in childhood reflects adaptive responses to the family system.'},
'III.4':{c:'Adolescent development: physical and emotional puberty, identity formation, risk-taking in adolescence, peer relationships, first romantic relationships, achievement.',p:['Tell me about your adolescence — what kind of teenager were you?','Were there periods of significant risk-taking, rule-breaking, or rebellion?','How did your peer relationships and social life develop through high school?'],am:'Adolescent risk-taking that was significantly above peers (legal involvement, substance use, sexual behavior, recklessness) is a relevant developmental marker for character evaluation.'},
'III.5':{c:'Formative experiences and life narrative: key experiences that shaped identity, values, and psychological development. Turning points, losses, achievements, and experiences of mastery or failure.',p:['What were the most formative experiences of your life — the things that most shaped who you became?','Were there significant losses or challenges in your development?','What experiences gave you your strongest sense of who you are and what you value?'],am:'Narrative coherence — the ability to construct a coherent, integrated account of one\'s own life — is a marker of psychological integration and reflective capacity. Fragmented, incoherent, or idealized narratives carry different clinical implications.'},
'IV.1':{c:'Family of origin structure: composition (parents, stepparents, siblings), stability (moves, separations, divorces), socioeconomic context, geographic and cultural setting.',p:['Tell me about your family growing up — who was in the household, how stable was the living situation?','Were your parents together? Any significant changes in family structure?','What was the economic situation like — were there financial pressures?'],am:''},
'IV.2':{c:'Parental character and psychopathology: mental health, substance use, personality, and character of each parent. Parenting style — warm, cold, authoritative, authoritarian, permissive, neglectful, abusive.',p:['Tell me about your relationship with your mother growing up — what kind of person was she?','And your father — describe his character, his strengths and difficulties.','Were there mental health problems, drinking, or substance use with either parent?','How did each parent approach discipline and emotional connection?'],am:'Parental psychopathology (especially AUD, personality disorder, and trauma) is one of the strongest predictors of the same in offspring, through both genetic and environmental mechanisms.'},
'IV.3':{c:'Family emotional climate: the affective tone of the household. Was the home warm and safe, chaotic and unpredictable, emotionally cold, conflict-ridden, or violent?',p:['What was the emotional atmosphere in your home — warm, tense, chaotic, quiet?','Was there conflict between your parents? How was it handled?','Did you feel emotionally safe at home?'],am:'Family emotional climate is the context for early attachment and shapes core beliefs about safety, trust, and self-worth. A chaotic or threatening home environment is a major adverse childhood experience with lasting psychiatric consequences.'},
'IV.4':{c:'Sibling relationships: number and order, quality of sibling relationships, role in sibling system, sibling psychopathology.',p:['Tell me about your siblings — how many, where do you fall?','What were your relationships with your siblings like?','Did any of your siblings have significant struggles — health, mental health, legal, or substance?'],am:''},
'IV.5':{c:'Intergenerational patterns: patterns of psychopathology, trauma, attachment, and coping that appear across generations in the family.',p:['Looking at your family across generations — grandparents, parents, yourself — do you see any patterns?','Patterns of addiction, depression, anxiety, abuse, or estrangement that seem to repeat?','How much do you feel like you\'ve broken from those patterns, and how much do you feel them still operating in you?'],am:'Recognition of intergenerational patterns reflects reflective functioning capacity — a marker of psychological health and therapeutic alliance potential.'},
'V.1':{c:'Academic trajectory: overall academic performance from elementary through highest level completed. Consistency vs. variability. Grades, effort, and outcome.',p:['Walk me through your academic history — what kind of student were you, from early school through your highest level?','Were your grades consistent, or were there periods of significantly better or worse performance?','What level of education did you complete?'],am:'Academic underperformance relative to apparent ability may reflect ADHD, learning disorder, mood disorder, trauma, or substance use. Academic trajectory is required for neurodevelopmental diagnoses.'},
'V.2':{c:'Cognitive and intellectual profile: self-reported cognitive strengths and weaknesses. Any concerns about learning, processing speed, or specific academic domains.',p:['How would you characterize yourself intellectually — what are you good at cognitively, and where do you struggle?','Did you have any specific difficulty with reading, math, or writing that others didn\'t seem to have?','Were you ever evaluated for learning differences or given any special accommodations?'],am:'Specific academic accommodations (IEPs, 504 plans, extended time) are aeromedically significant. For ADHD and SLD evaluations, verifying whether academic achievement was maintained without accommodations is required.'},
'V.3':{c:'Social and behavioral adjustment in school: peer relationships in school settings, behavioral issues, disciplinary actions, suspensions, expulsions.',p:['How did you fit in socially in school — did you have friends, were you part of a group?','Were there behavioral problems at school — disciplinary actions, suspensions?','How did you relate to teachers and authority figures in school?'],am:'School behavioral problems (conduct disorder features before age 15) are required for ASPD diagnosis. Early peer relationship difficulties may reflect neurodevelopmental or character pathology.'},
'V.4':{c:'Achievement motivation: drive, ambition, and persistence in academic and occupational settings. Relationship to achievement, competition, and success.',p:['How driven were you academically — did you push yourself, or did you do what was required and no more?','What motivated you to achieve — genuine interest, competition, need for approval, fear of failure?'],am:'Achievement motivation in the context of narcissistic dynamics (driven by need for validation) vs. genuine interest (driven by mastery and meaning) has character implications relevant to ARMA.'},
'VI.1':{c:'Civilian employment history: all significant employment prior to military service or outside military context. Job stability, performance, and reasons for leaving.',p:['Before the military, or alongside it — what was your work history?','Were there any jobs you left under difficult circumstances, or any significant job performance concerns?'],am:''},
'VI.2':{c:'Military entry and trajectory: reason for joining, entry pathway, early military performance, career arc, rank progression, awards, and adverse administrative actions.',p:['Why did you join the military — what was the motivation?','Walk me through your military career — major assignments, positions, rank progression.','Any adverse administrative actions, Article 15s, or periods of counseling?'],am:'Military career arc is the primary professional data source. Stalled rank progression, repeated lateral moves, or a pattern of conflicts with leadership are clinically significant.'},
'VI.3':{c:'Aviation history: how the aviator came to fly, aircraft progression, total flight hours, type ratings, most recent flying. Performance on checkrides and standardization evaluations.',p:['How did you get into aviation — what was the path?','Walk me through your flying career — aircraft, assignments, hours.','How have checkrides and standardization evaluations gone?'],am:'Aviation history is the professional core of the aeromedical evaluation. Flight hours, aircraft complexity, and performance history establish the aviator\'s professional context and the stakes of the evaluation.'},
'VI.4':{c:'Deployment history: number, duration, and location of deployments. Combat exposure. Hardship and separation. Post-deployment adjustment.',p:['Walk me through your deployments — where, how long, what were the operational conditions?','Were you in direct combat situations?','How did post-deployment adjustment go — for you and your family?'],am:'Deployment history is essential context for PTSD evaluation and for understanding cumulative operational stress. Post-deployment adjustment difficulties are a common precursor to mental health referral.'},
'VI.5':{c:'Occupational identity and meaning: how central is military/aviation identity to the person\'s sense of self. What does flying mean to them as a person, not just a career.',p:['What does being a military aviator mean to you — beyond the job?','How central is this identity to who you are?','What would it mean to you to lose your flying status permanently?'],am:'Aviation identity is a core evaluative concept. Strong aviation identity motivates recovery and return but can also drive minimization and non-disclosure. It is a major factor in secondary gain analysis.'},
'VI.6':{c:'Relationship to authority and hierarchy: how the person has historically navigated authority, supervision, rules, and hierarchy. Patterns of compliance, rebellion, or conflict.',p:['How have you generally gotten along with your supervisors and leadership over your career?','Have there been periods of significant conflict with authority?','How do you feel about rules and regulations — do you tend to see them as necessary structure or as constraints?'],am:'Relationship to authority is a primary character indicator in the aeromedical context. Persistent conflict with authority, rule violations, or a pattern of challenges to supervision are red flags for ASPD and ARMA.'},
'VII.1':{c:'Attachment pattern: inferred from relational history across caregiving relationships, peer relationships, and romantic relationships. Secure, anxious-preoccupied, dismissive-avoidant, or disorganized.',p:['Looking across your relationships through life — do you tend to feel secure and comfortable with closeness, or do you notice anxiety or discomfort around intimacy?','When relationships become stressful, do you tend to move toward others for support, or pull away?','Have you had a pattern of relationships that start intensely and then break down?'],am:'Attachment theory as clinical framework: secure attachment predicts emotional stability under stress, appropriate help-seeking, and capacity for collaborative therapeutic work. Disorganized attachment predicts significant affect dysregulation and interpersonal instability under operational stress.'},
'VII.2':{c:'Peer relationships across development: quality and stability of friendships through childhood, adolescence, and adulthood. Closeness, reciprocity, conflict resolution.',p:['Have you had close friendships throughout your life — people you could really count on?','How many close friends do you have now?','Do friendships tend to be stable for you, or have they been more short-lived or conflict-prone?'],am:''},
'VII.3':{c:'Romantic history: chronological account of significant romantic relationships. Duration, intensity, quality of connection, reasons for ending, and patterns across relationships.',p:['Walk me through your significant romantic relationships — who they were, how long they lasted, how they ended.','Looking across those relationships, are there patterns you notice?','How have breakups or losses in relationships affected you?'],am:''},
'VII.4':{c:'Current relationship depth: quality of current primary relationship, satisfaction, conflict patterns, communication, and emotional intimacy.',p:['Tell me about your current relationship — how would you describe it?','Where are the areas of strength, and where are the sources of tension?','How do you and your partner communicate when there\'s a disagreement?'],am:'Current relationship quality is a major mental health factor and a critical stressor or protective factor in aeromedical cases. Partner distress about the aviator\'s behavior or symptoms is often clinically significant collateral.'},
'VII.5':{c:'Marriage: satisfaction, conflict, communication patterns, sexual intimacy, shared goals. For divorced individuals: what happened and what role did each person play.',p:['How would you rate the overall health of your marriage right now?','What are the main sources of conflict, and how are they typically handled?','Has the current mental health situation affected your relationship?'],am:'Marital distress is both a cause and consequence of many psychiatric conditions. Threat of divorce or ongoing marital conflict is a major stressor relevant to adjustment disorder and crisis presentations.'},
'VII.6':{c:'Children and parenting: number of children, ages, quality of relationship with each. Parenting role and responsibility. Parenting-related stress.',p:['Tell me about your children — ages, relationships with each.','How is the parenting partnership working — how is the division of responsibility?','Have your children been affected by what\'s been going on?'],am:'Parental role is a major source of meaning and a powerful protective factor. Children\'s knowledge of or exposure to a parent\'s mental health crisis is clinically significant.'},
'VII.7':{c:'Friendship and social network: current social connections, breadth and depth of relationships, social isolation vs. social engagement, squadron relationships.',p:['Tell me about your social life now — who do you spend time with, how connected do you feel?','How are your relationships within your unit or squadron?','Have you pulled back socially since things have been difficult?'],am:'Social withdrawal is both a symptom (depression, PTSD) and a risk factor for worsening. Squadron relationships are a primary social context for military aviators and a source of significant collateral information.'},
'VII.8':{c:'Interpersonal pattern recognition: synthesis of relational patterns observed across domains. Recurring dynamics, characteristic ways of relating, and consistency between described and observed.',p:['Looking at all the relationships we\'ve discussed — do you notice patterns in how you tend to relate to people?','Is the way you relate to me in this interview consistent with how you relate to others?'],am:''},
'VIII.1':{c:'Personality organization (Kernberg): level of organization on the spectrum from neurotic (stable identity, realistic self/other, mature defenses) to borderline (identity diffusion, splitting, primitive defenses) to psychotic (reality testing impaired). This is NOT a DSM diagnosis — it is a dimensional assessment of psychological structure.',p:['Observe throughout: How stable and coherent is the person\'s sense of identity across the interview?','Can they hold ambivalence — seeing both positive and negative in the same person?','What is the predominant defense level — mature (sublimation, humor, altruism), neurotic (repression, rationalization), or primitive (splitting, projection, denial)?'],am:'Kernberg\'s levels of personality organization provide a more clinically precise picture than DSM categories alone. Borderline-level organization predicts instability under operational stress even without a formal BPD diagnosis.'},
'VIII.2':{c:'Character style: the predominant personality style that organizes the person\'s characteristic approach to self, others, and the world. Hysterical, obsessive, narcissistic, paranoid, masochistic, schizoid, dependent, or mixed.',p:['What is the predominant flavor of this person\'s character — how do they characteristically relate?','Is the style ego-syntonic (felt as natural) or ego-dystonic (experienced as alien)?','Is the style adaptive (functional) or maladaptive in the aviation context?'],am:''},
'VIII.3':{c:'Narcissistic features: grandiosity (overt or covert), entitlement, empathy deficits, need for admiration, exploitation of others, envy, arrogance. Covert narcissism (fragile, hypersensitive) vs. overt (bold, entitled).',p:['How does the person respond to evaluation and feedback — do they take it in, deflect, or become defensive?','Is there an inflated sense of special status or entitlement visible in the interview?','How do they relate to others in the narrative — as full people, or as props in their story?'],am:'Narcissistic features are specifically flagged by ACS as particularly undesirable in aviators. Inflated self-assessment directly affects adherence to rules, response to standardization feedback, and willingness to self-ground.'},
'VIII.4':{c:'Antisocial features: disregard for others\' rights, deceitfulness, exploitation, impulsivity, recklessness, lack of remorse. Below threshold for ASPD but clinically significant.',p:['Is there evidence of deceitfulness or minimization in the history that suggests a pattern rather than an isolated instance?','Is there a history of rule violations, exploitation of others, or deliberate harm to others?','When the person has caused harm, what is their relationship to that — remorse, rationalization, or indifference?'],am:'Antisocial features below ASPD threshold can still constitute grounds for an unsatisfactory ARMA rating. The pattern matters more than any single incident.'},
'VIII.5':{c:'Affect regulation: the capacity to tolerate, modulate, and recover from emotional states. Range, intensity, lability, and recovery from emotional arousal.',p:['How does this person manage strong emotions — do they contain them, express them appropriately, or get overwhelmed?','How quickly do they recover from emotional arousal?','Is their emotional range appropriate to the content being discussed?'],am:'Affect dysregulation under operational stress is a primary risk factor in aviation. The capacity to tolerate emotional intensity without losing cognitive function is directly relevant to cockpit performance.'},
'VIII.6':{c:'Impulse control: capacity to delay gratification, inhibit action on impulse, and tolerate frustration. Both behavioral and verbal impulsivity.',p:['Does the person give evidence of acting before thinking in the history or in the interview?','How do they describe handling frustration, anger, or urgent urges?','Is there a history of decisions that were clearly impulsive in retrospect?'],am:'Impulse control is a core aviation safety characteristic. Poor impulse control under time pressure in the cockpit is directly dangerous.'},
'VIII.7':{c:'Moral functioning: the quality of the person\'s conscience — depth and stability of ethical commitments, honesty, treatment of others, handling of ethical conflict.',p:['How does the person describe situations where they faced ethical conflict or were tempted to act in ways that violated their values?','Is there evidence of a stable and genuine moral compass in the history and the interview?','How do they talk about times when they caused harm — with what quality of remorse or reflection?'],am:'Moral functioning is directly relevant to the trustworthiness of an aviator in safety-critical environments. Superficial morality — the appearance of ethics without the substance — is a specific concern in antisocial presentations.'},
'VIII.8':{c:'Predominant defenses: characteristic psychological defenses. Mature (sublimation, humor, altruism), neurotic (repression, rationalization, intellectualization, displacement, reaction formation), or primitive (splitting, projection, projective identification, denial, idealization/devaluation).',p:['Observe throughout: Does the person intellectualize or rationalize as a primary defense?','Is there splitting visible — all-good or all-bad characterizations of significant others?','Is projection operating — attributing their own traits or feelings to others?'],am:''},
'VIII.9':{c:'Character under pressure: how does the person\'s character manifest when stressed — at their most adaptive or most maladaptive? What does operational pressure reveal?',p:['Tell me about a time when you were under significant stress — what did that bring out in you?','How do you tend to behave when you\'re pushed to your limits?','What have others said about how you are when things are really hard?'],am:'Character under stress is the most aeromedically relevant character assessment. An aviator may appear psychologically healthy at baseline but show significant character pathology under operational pressure. This is exactly the scenario the aeromedical evaluation must assess.'},
'IX.1':{c:'ACE (Adverse Childhood Experiences) framework: 10 ACE categories — physical, sexual, and emotional abuse; physical and emotional neglect; parental mental illness; parental substance abuse; parental incarceration; domestic violence; family member suicide. Cumulative ACE score predicts adult health outcomes.',p:['I want to ask about some difficult childhood experiences that can affect health in lasting ways.','Growing up, were you ever physically abused — hit, hurt in a way that left marks, or treated in a way that felt physically harmful?','Were you ever sexually abused as a child?','Was there emotional abuse — being regularly told you were worthless, stupid, or unloved?','Was there significant neglect — not having basic needs like food, clothing, or safety reliably met?'],am:'High ACE scores are strongly associated with depression, anxiety, PTSD, substance use disorders, and personality pathology in adults. This framework grounds the developmental formulation in evidence-based risk factors.'},
'IX.2':{c:'Non-family childhood trauma: traumatic events in childhood that occurred outside the family — accidents, violence, peer victimization (bullying), community violence, disasters, medical trauma.',p:['Beyond the family, were there any traumatic experiences in childhood — accidents, violence, serious medical events, or community violence?','Were you ever seriously bullied or victimized by peers?','Were there any events outside the home that were frightening or overwhelming?'],am:''},
'IX.3':{c:'Adult trauma: all traumatic events in adulthood meeting DSM Criterion A (exposure to actual or threatened death, serious injury, or sexual violence). Both single-incident and cumulative operational trauma.',p:['Have there been traumatic events in your adult life — accidents, violence, combat, assault, or other life-threatening experiences?','Walk me through each significant traumatic event in adulthood.','Are there events you have deliberately not mentioned because they are hard to talk about?'],am:'Adult trauma in military aviation commonly includes combat exposure, mishap involvement, loss of wingmen, SERE, CSAR, and operational stress from repeated high-risk missions. Each event should be individually documented.'},
'IX.4':{c:'Moral injury: damage to moral conscience from perpetrating, failing to prevent, or witnessing acts that violate deeply held moral beliefs. Distinct from fear-based PTSD. Guilt, shame, loss of meaning, betrayal, and spiritual crisis are hallmarks.',p:['Were there aspects of your military service — things you did, failed to do, or witnessed others do — that have stayed with you morally?','Is there something from your service that you carry as a burden of guilt or shame?','Have you felt betrayed — by leadership, by the institution, or by what you understood the mission to be?'],am:'Moral injury is clinically distinct from PTSD and requires different treatment approaches. Evidence-based treatments for moral injury (ACT, meaning-centered therapy, spiritually-informed approaches) differ from trauma-focused exposure therapy.'},
'IX.5':{c:'Trauma processing and integration: how has the person processed and integrated their traumatic experiences? Degree of integration, avoidance, intrusive recollection, meaning-making, and post-traumatic growth.',p:['Of everything you\'ve experienced that was traumatic — where are you in making sense of it?','Have any of these experiences been something you\'ve been able to integrate and learn from, or do they remain raw and unprocessed?','Have you ever worked through any of this in therapy?'],am:'Degree of trauma integration is the prognostic question for waiver consideration in PTSD. Unprocessed trauma that is being actively avoided is a higher risk profile than trauma that has been engaged with therapeutically.'},

function computeThreshold(domId, coverage) {
  const t = THRESHOLDS[domId];
  if (!t) return null;
  const pos = id => coverage[id] === '+';
  if (t.clusters) {
    const results = t.clusters.map(cl => {
      const met = cl.of.filter(pos).length;
      return { id: cl.id, met, need: cl.need, ok: met >= cl.need };
    });
    const allMet = results.every(r => r.ok);
    const metCount = results.filter(r => r.ok).length;
    return { type:'cluster', results, allMet, metCount, total:results.length, label:t.label };
  }
  const met    = t.of.filter(pos).length;
  const gateOk = !t.gate || t.gate.some(pos);
  const fullMet = met >= t.need && gateOk;
  const close   = !fullMet && met >= t.need - 1;
  return { type:'simple', met, need:t.need, gateOk, fullMet, close, label:t.label };
}

function pairKey(a, b) {
  return [a, b].sort().join('|');
}

// ── DIFFERENTIAL COMPUTATION ──────────────────────────
function computeDifferential(coverage) {
  const results = [];
  Object.entries(THRESHOLDS).forEach(([domId]) => {
    const tr = computeThreshold(domId, coverage);
    const t  = THRESHOLDS[domId];
    if (!tr) return;
    let score = 0, display = '', indeterminate = 0;

    if (tr.type === 'cluster') {
      const clMet   = tr.results.filter(r => r.ok).length;
      const clTotal = tr.results.length;
      score = clMet / clTotal;
      t.clusters.forEach(cl => {
        cl.of.forEach(id => { if (coverage[id] === '~') indeterminate++; });
      });
      display = tr.results.map(r => r.id + (r.ok ? '\u2713' : r.met + '/' + r.need)).join(' ');
    } else {
      score = tr.fullMet ? 1 : (tr.met / tr.need);
      t.of.forEach(id => { if (coverage[id] === '~') indeterminate++; });
      const gateWarn = t.gate && !tr.gateOk ? ' \u00b7gate?' : '';
      display = tr.met + '/' + tr.need + gateWarn;
    }

    results.push({
      domId, label: t.label, score, display,
      fullMet: tr.type === 'cluster' ? tr.allMet : tr.fullMet,
      indeterminate, thresh: tr
    });
  });
  return results.sort((a, b) => b.score - a.score || b.indeterminate - a.indeterminate);
}

// ── STORAGE (localStorage) ────────────────────────────
const LS = {
  get(k)    { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k)    { try { localStorage.removeItem(k); } catch {} },
};

const mkCase = (code, rid) => ({
  id: `c${Date.now()}`,
  code: code.trim() || 'UNNAMED',
  referralId: rid,
  created: new Date().toISOString(),
  updated: new Date().toISOString(),
  sessions: [],
  coverage: {},
  threads: {},
  freeThreads: [],
  evalNotes: {},
  presessionNotes: '',      // free-form narrative from LLM
  presessionPriority: [],   // domain ids flagged as priority by LLM import
});

const fmtDate = iso => {

function Tag({ tag }) {

  return h('span', {

// ── STATE BUTTON ──────────────────────────────────────
function StateBtn({ state, ev, onClick, size = 26 }) {
  const cfg = (ev ? EV : CR)[state] || (ev ? EV : CR)['○'];
  return h('button', {
    onClick, title: cfg.label,
    style: { width: size, height: size, borderRadius: 4, cursor: 'pointer', fontSize: state.length > 1 ? 10 : 12, fontFamily: 'monospace', fontWeight: 700, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.12s', ...cfg.style }
  }, state);
}

// ── ITEM ROW — defined OUTSIDE parent; prevents remount on keystroke ──
const ItemRow = memo(function ItemRow({ item, ev, state, thr, evNote, expanded, onToggle, onCycle, onFlag, onThrNote, onEvNote, presessionProbe }) {
  const flagged  = thr && thr.flagged;
  const hasNote  = ev ? !!evNote : !!(thr && thr.note);
  const depth    = DEPTH[item.id];
  const isImportInd = state === '~';  // ~ set by import or by user — show PS tag if probe exists too
  const [probeStates, setProbeStates] = useState({});

  // Probe state cycle: 0=not asked, 1=positive, 2=negative, 3=indeterminate, 4=skipped
  const PROBE_STATES = [
    { sym:'\u2192', color: C.accent,    strike: false, label:'Not asked'     },
    { sym:'+', color: C.posGreen,  strike: false, label:'Positive'      },
    { sym:'\u2212', color: C.sigRed,    strike: true,  label:'Negative'      },
    { sym:'~', color: C.incAmber,  strike: false, label:'Indeterminate' },
    { sym:'\u25cb', color: C.txtMut,    strike: false, label:'Skipped'       },
  ];

  const cycleProbe = i => setProbeStates(prev => ({
    ...prev,
    [i]: ((prev[i] || 0) + 1) % PROBE_STATES.length
  }));

  return h('div', { style: { borderBottom: `1px solid ${C.bg}`, background: flagged ? C.flagBg : presessionProbe ? 'rgba(246,173,85,0.04)' : 'transparent' } },
    h('div', { style: { display: 'flex', alignItems: 'flex-start', gap: 8, padding: '7px 14px', minHeight: 40 } },
      h('div', { style: { paddingTop: 1, flexShrink: 0 } },
        h(StateBtn, { state, ev, onClick: onCycle })
      ),
      h('div', { style: { flex: 1, minWidth: 0 } },
        // Label row
        h('div', { style: { display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' } },
          h('span', { style: { fontSize: 12, color: C.txt, lineHeight: 1.45 } }, item.label),
          ev && h('span', { style: { fontSize: 8, background: 'rgba(183,148,244,0.18)', color: '#b794f4', borderRadius: 3, padding: '1px 4px', fontFamily: 'monospace', fontWeight: 600 } }, 'EV'),
          presessionProbe && h('span', { title: 'Case-specific probe from pre-session import', style: { fontSize: 8, background: C.flagBg, color: C.flag, borderRadius: 3, padding: '1px 4px', fontFamily: 'monospace', fontWeight: 600, border: `1px solid ${C.flagBdr}` } }, 'PS'),
          h('div', { style: { display: 'flex', gap: 2 } }, ...item.tags.slice(0, 3).map(t => h(Tag, { key: t, tag: t })))
        ),
        // Pre-session probe (case-specific, from import)
        presessionProbe && h('div', { style: { display: 'flex', gap: 5, marginTop: 5, marginBottom: 4, padding: '5px 8px', background: C.flagBg, borderRadius: 4, border: `1px solid ${C.flagBdr}` } },
          h('span', { style: { color: C.flag, flexShrink: 0, fontWeight: 700, fontSize: 11 } }, 'PS:'),
          h('span', { style: { fontSize: 11, color: C.txt, lineHeight: 1.5 } }, presessionProbe)
        ),
        // Depth content
        depth && h('div', { style: { marginTop: 5 } },
          h('div', { style: { fontSize: 10, color: C.txtSec, lineHeight: 1.5, fontStyle: 'italic', marginBottom: 4 } }, depth.c),
          ...depth.p.map((q, i) => {
            const st = PROBE_STATES[probeStates[i] || 0];
            return h('div', {
              key: i,
              onClick: () => cycleProbe(i),
              title: st.label,
              style: { display: 'flex', gap: 5, marginBottom: 4, fontSize: 11, lineHeight: 1.45, cursor: 'pointer', userSelect: 'none' }
            },
              h('span', { style: { color: st.color, flexShrink: 0, fontWeight: 700, fontSize: 13, lineHeight: 1, minWidth: 14, textAlign: 'center' } }, st.sym),
              h('span', { style: { color: st.strike ? C.txtMut : C.txtSec, textDecoration: st.strike ? 'line-through' : 'none' } }, q)
            );
          }),
          depth.am && h('div', { style: { display: 'flex', gap: 5, marginTop: 5, fontSize: 10, lineHeight: 1.45 } },
            h('span', { style: { color: C.notedBlue, flexShrink: 0, fontWeight: 600 } }, 'AM:'),
            h('span', { style: { color: C.notedBlue, opacity: 0.85 } }, depth.am)
          )
        )
      ),
      // Action buttons — top-aligned
      h('div', { style: { display: 'flex', flexShrink: 0, paddingTop: 1 } },
        h('button', {
          onClick: onToggle, title: 'Toggle note',
          style: { background: 'none', border: 'none', cursor: 'pointer', padding: '2px 5px', flexShrink: 0, fontSize: 15, color: hasNote ? C.notedBlue : C.txtMut, opacity: hasNote ? 1 : 0.5, lineHeight: 1 }
        }, '\u270e'),
        h('button', {
          onClick: onFlag, title: flagged ? 'Remove flag' : 'Flag for follow-up',
          style: { background: 'none', border: 'none', cursor: 'pointer', padding: '2px 5px', flexShrink: 0, fontSize: 14, color: flagged ? C.flag : C.txtMut, opacity: flagged ? 1 : 0.5, lineHeight: 1 }
        }, '\u2691')
      )
    ),
    expanded && h('div', { style: { padding: '2px 14px 10px 54px' } },
      h('textarea', {
        value: ev ? evNote : (thr && thr.note) || '',
        onChange: e => ev ? onEvNote(e.target.value) : onThrNote(e.target.value),
        placeholder: ev ? 'Clinical observation\u2026' : 'Thread note\u2026',
        rows: 2,
        autoFocus: true,
        style: { width: '100%', fontSize: 11, color: C.txt, background: C.bg, border: `1px solid ${C.border}`, borderRadius: 5, padding: '6px 8px', lineHeight: 1.5 }
      })
    )
  );
});

// ── HOME SCREEN ───────────────────────────────────────
function HomeScreen({ cases, onOpen, onCaseCreated, onCaseDeleted, onCaseImported }) {
  const [showForm,   setShowForm]   = useState(false);
  const [code,       setCode]       = useState('');
  const [rid,        setRid]        = useState('');
  const [deletingId, setDeletingId] = useState(null);
  const importRef = useRef(null);

  const importCase = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const c = JSON.parse(ev.target.result);
        if (!c.id || !c.code) throw new Error('Invalid case file');
        c.updated = new Date().toISOString();
        onCaseImported(c);
      } catch {
        alert('Could not import — file may be corrupt or not an FPIQ case.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const saveApp = async () => {
    let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    try {
      const [rSrc, rdSrc] = await Promise.all([
        fetch('https://esm.sh/react@18?bundle').then(r => r.text()),
        fetch('https://esm.sh/react-dom@18/client?bundle').then(r => r.text()),
      ]);
      // Replace CDN imports with inlined code
      html = html
        .replace(`from "https://esm.sh/react@18"`, `from "data:text/javascript;base64,${btoa(unescape(encodeURIComponent(rSrc)))}"`)
        .replace(`from "https://esm.sh/react-dom@18/client"`, `from "data:text/javascript;base64,${btoa(unescape(encodeURIComponent(rdSrc)))}"`)
    } catch(e) {
      // Save without inlining if offline — still needs internet to run
      console.warn('Saving without offline support:', e);
    }
    const blob = new Blob([html], { type: 'text/html' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `FPIQ_App_${new Date().toISOString().slice(0,10)}.html`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const create = () => {
    if (!code.trim() || !rid) return;
    const c = mkCase(code, rid);
    LS.set(`fpiq:${c.id}`, c);
    const idx = LS.get('fpiq_index') || [];
    LS.set('fpiq_index', [...idx, c.id]);
    setCode(''); setRid(''); setShowForm(false);
    onCaseCreated(c);
  };

  const del = (e, id) => {
    e.stopPropagation();
    LS.del(`fpiq:${id}`);
    const idx = LS.get('fpiq_index') || [];
    LS.set('fpiq_index', idx.filter(i => i !== id));
    setDeletingId(null);
    onCaseDeleted(id);
  };

  const exportCase = async (e, c) => {
    e.stopPropagation();
    const filename = `FPIQ_${c.code}_${new Date().toISOString().slice(0, 10)}.json`;
    const file = new File([JSON.stringify(c, null, 2)], filename, { type: 'application/json' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: filename });
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
      }
    }

    const blob = new Blob([JSON.stringify(c, null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  };

  return h('div', { style: { display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' } },

    // Header
    h('div', { style: hdr },
      h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, flex: 1 } },
        h('span', { style: { fontFamily: 'monospace', fontSize: 16, fontWeight: 700, color: C.accent, letterSpacing: '0.06em' } }, 'FPIQ'),
        h('span', { style: { fontSize: 10, color: C.txtMut, fontFamily: 'monospace' } }, 'v1.20260627.1'),
        h('span', { style: { color: C.border, fontSize: 16 } }, '·'),
        h('span', { style: { fontSize: 13, color: C.txtSec } }, 'Evaluations'),
      ),
      h('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
        h('button', {
          onClick: saveApp,
          title: 'Download a copy of this app file',
          style: { ...btn(false), fontSize: 12, color: C.txtMut }
        }, '\u2193 Save app'),
        h('button', {
          onClick: () => importRef.current && importRef.current.click(),
          title: 'Import a case from JSON file',
          style: { ...btn(false), fontSize: 12 }
        }, '\u2191 Import case'),
        h('input', {
          ref: importRef, type: 'file', accept: '.json',
          onChange: importCase,
          style: { display: 'none' }
        }),
        h('button', {
          onClick: () => setShowForm(s => !s),
          style: { ...btn(showForm), fontSize: 13 }
        }, '+ New evaluation')
      )
    ),

    // New case form
    showForm && h('div', { style: { background: C.s1, borderBottom: `1px solid ${C.border}`, padding: '14px 18px', flexShrink: 0 } },
      h('div', { style: { fontSize: 11, color: C.txtMut, marginBottom: 10 } }, 'No PHI in reference code — use your own mapping'),
      h('div', { style: { display: 'flex', gap: 10, alignItems: 'flex-end' } },
        h('div', { style: { flex: 1 } },
          h('div', { style: { fontSize: 10, color: C.txtMut, marginBottom: 4 } }, 'Reference code'),
          h('input', {
            value: code,
            onChange: e => setCode(e.target.value),
            onKeyDown: e => e.key === 'Enter' && create(),
            placeholder: 'e.g. RP-2026-001',
            style: { width: '100%', padding: '7px 10px', fontSize: 13, borderRadius: 6, border: `1px solid ${C.border}`, background: C.bg, color: C.txt }
          })
        ),
        h('div', { style: { flex: 1.6 } },
          h('div', { style: { fontSize: 10, color: C.txtMut, marginBottom: 4 } }, 'Referral question'),
          h('select', {
            value: rid,
            onChange: e => setRid(e.target.value),

// ── PRE-SESSION PROMPT GENERATOR ─────────────────────
function generatePrompt(cd) {
  const rq = REFERRAL_QUESTIONS.find(r => r.id === cd.referralId);

  // Full domain + item index
  const domainIndex = DOMAINS.map(d =>
    d.id + ' = ' + d.name + '\n' +
    d.items.map(it => '    ' + it.id + ' = ' + it.label).join('\n')
  ).join('\n');

  const lines = [];
  lines.push('You are assisting a forensic and occupational psychiatrist (aeromedical specialty) preparing for a forensic psychiatric evaluation. The physician has already reviewed records with you and discussed clinical impressions. Now generate a structured pre-session briefing for use in their interview instrument (FPIQ).');
  lines.push('');
  lines.push('Return your response in TWO parts, in this exact order:');
  lines.push('');
  lines.push('\u2550'.repeat(46));
  lines.push('PART 1 \u2014 STRUCTURED ANNOTATION');
  lines.push('\u2550'.repeat(46));
  lines.push('');
  lines.push('Use exactly these section headers. Each item on its own line starting with a dash.');
  lines.push('');
  lines.push('PRIORITY DOMAINS: [comma-separated domain codes \u2014 the 4-6 most critical for this case]');
  lines.push('');
  lines.push('THREADS:');
  lines.push('- [open clinical question or inconsistency requiring active tracking]');
  lines.push('- [add as many threads as the case warrants \u2014 include all meaningful open questions, inconsistencies, and things to watch]');
  lines.push('');
  lines.push('INDETERMINATE:');
  lines.push('- [exact item code from list below]: [brief rationale \u2014 what is known from records but unconfirmed in interview]');
  lines.push('- [add as many lines as the case warrants]');
  lines.push('');
  lines.push('PROBES:');
  lines.push('- [exact item code from list below]: [case-specific question for this evaluee \u2014 not a generic probe]');
  lines.push('- [add as many lines as the case warrants \u2014 include every item where a case-specific question would materially improve the interview]');
  lines.push('');
  lines.push('\u2550'.repeat(46));
  lines.push('PART 2 \u2014 CLINICAL NARRATIVE');
  lines.push('\u2550'.repeat(46));
  lines.push('');
  lines.push('Write 3-5 paragraphs of clinical reasoning: differential picture, key diagnostic questions, character and aeromedical concerns, what this evaluation most needs to establish, and anything the records suggest that the evaluee may minimize or deny. Be specific to this case \u2014 avoid generic language.');
  lines.push('');
  lines.push('\u2500'.repeat(46));
  lines.push('CASE CONTEXT');
  lines.push('\u2500'.repeat(46));
  lines.push('Reference code: ' + cd.code);
  lines.push('Referral question: ' + (rq ? rq.label : 'Not specified'));
  if (cd.sessions && cd.sessions.length > 0) {
    lines.push('Sessions completed: ' + cd.sessions.length);
  }
  if (cd.freeThreads && cd.freeThreads.length > 0) {
    lines.push('');
    lines.push('Active threads from prior sessions:');
    cd.freeThreads.forEach(ft => lines.push('- ' + ft.text));
  }
  if (cd.presessionNotes) {
    const notesBlocks = cd.presessionNotes.split(/\n\n---\n\n/);
    const latestBlock = notesBlocks[notesBlocks.length - 1];
    lines.push('');
    lines.push('Prior pre-session notes (most recent):');
    lines.push(latestBlock.slice(0, 600) + (latestBlock.length > 600 ? '...' : ''));
  }
  lines.push('');
  lines.push('\u2500'.repeat(46));
  lines.push('DOMAIN AND ITEM CODES');
  lines.push('Use these exact codes in INDETERMINATE and PROBES sections.');
  lines.push('Format: domainId.itemSuffix (e.g. X.A.A1, X.F.B2, X.H.ari)');
  lines.push('Do not invent or abbreviate codes.');
  lines.push('\u2500'.repeat(46));
  lines.push(domainIndex);

  return lines.join('\n');
}

// ── PRE-SESSION IMPORT PARSER ─────────────────────────
function parseImport(text) {
  const result = {
    priorityDomains: [],
    threads: [],
    indeterminate: [],
    probes: [],
    narrative: '',
    errors: [],
  };

  // Split on PART 2 marker to separate structured from narrative
  const part2Match = text.match(/PART\s*2\s*[—\-]+\s*CLINICAL NARRATIVE/i);
  const structuredText = part2Match ? text.slice(0, part2Match.index) : text;
  const narrativeText  = part2Match ? text.slice(part2Match.index).replace(/PART\s*2\s*[—\-]+\s*CLINICAL NARRATIVE/i, '').replace(/={3,}/g, '').trim() : '';
  result.narrative = narrativeText;

  // PRIORITY DOMAINS
  const priMatch = structuredText.match(/PRIORITY DOMAINS:\s*([^\n]+)/i);
  if (priMatch) {
    result.priorityDomains = priMatch[1].split(',').map(s => s.trim()).filter(Boolean);
  }

  // THREADS — lines starting with - under THREADS header
  const thrSection = structuredText.match(/THREADS:\s*([\s\S]*?)(?=\n[A-Z][A-Z\s]+:|$)/i);
  if (thrSection) {
    const items = thrSection[1].match(/^\s*-\s*(.+)$/gm);
    if (items) result.threads = items.map(l => l.replace(/^\s*-\s*/, '').trim()).filter(Boolean);
  }

  // INDETERMINATE — lines: - code: rationale (dash optional; code: pattern below still validates)
  const indSection = structuredText.match(/INDETERMINATE:\s*([\s\S]*?)(?=\n[A-Z][A-Z\s]+:|$)/i);
  if (indSection) {
    const items = indSection[1].match(/^[ \t]*-?[ \t]*(.+)$/gm);
    if (items) {
      items.forEach(l => {
        const m = l.replace(/^\s*-\s*/, '').match(/^([A-Za-z0-9._-]+):\s*(.+)$/);
        if (m) result.indeterminate.push({ id: m[1].trim(), note: m[2].trim() });
        else result.errors.push('Could not parse indeterminate item: ' + l.trim());
      });
    }
  }

  // PROBES — lines: - code: question (dash optional; code: pattern below still validates)
  const probeSection = structuredText.match(/PROBES:\s*([\s\S]*?)(?=\n[A-Z][A-Z\s]+:|={3,}|$)/i);
  if (probeSection) {
    const items = probeSection[1].match(/^[ \t]*-?[ \t]*(.+)$/gm);
    if (items) {
      items.forEach(l => {
        const m = l.replace(/^\s*-\s*/, '').match(/^([A-Za-z0-9._-]+):\s*(.+)$/);
        if (m) result.probes.push({ id: m[1].trim(), question: m[2].trim() });
        else result.errors.push('Could not parse probe: ' + l.trim());
      });
    }
  }

  return result;
}

// ── IMPORT MODAL ──────────────────────────────────────
function ImportModal({ cd, onApply, onClose }) {
  const [text, setText] = useState('');
  const [preview, setPreview] = useState(null);
  const [applied, setApplied] = useState(false);

  const parse = () => setPreview(parseImport(text));

  const apply = () => {
    if (!preview) return;
    // Build updates to case
    const updates = {};

    // Priority domains — store for tile highlighting
    if (preview.priorityDomains.length > 0) {
      updates.presessionPriority = preview.priorityDomains;
    }

    // Threads → freeThreads
    const newThreads = preview.threads.map(t => ({ id: `ft${Date.now()}${Math.random()}`, text: t, created: new Date().toISOString(), source: 'import' }));
    updates.freeThreads = [...(cd.freeThreads || []), ...newThreads];

    // Indeterminate items → coverage (only if currently unaddressed)
    if (preview.indeterminate.length > 0) {
      const cov = { ...cd.coverage };
      preview.indeterminate.forEach(({ id }) => { if (!cov[id] || cov[id] === '○') cov[id] = '~'; });
      updates.coverage = cov;
    }

    // Probes → store as presession probe overrides (displayed in item depth)
    if (preview.probes.length > 0) {
      const existing = cd.presessionProbes || {};
      preview.probes.forEach(({ id, question }) => { existing[id] = question; });
      updates.presessionProbes = existing;
    }

    // Narrative
    if (preview.narrative) {
      updates.presessionNotes = (cd.presessionNotes ? cd.presessionNotes + '\n\n---\n\n' : '') + preview.narrative;
    }

    onApply(updates);
    setApplied(true);
    setTimeout(onClose, 1200);
  };

  const domainValid = id => DOMAINS.some(d => d.id === id);

  return h('div', {
    style: { position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.72)', zIndex: 200, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 },

        h('button', { onClick: onClose, style: { background: 'none', border: 'none', cursor: 'pointer', color: C.txtMut, fontSize: 22, padding: '0 4px', lineHeight: 1 } }, '\u00d7')
      ),

        // Paste area

          }),

            h('button', { onClick: parse, disabled: !text.trim(), style: { ...btn(!!text.trim()), fontSize: 12 } }, 'Parse'),
