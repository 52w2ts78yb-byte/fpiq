const DEPTH = {
'X.F.adj':{c:'Emotional or behavioral symptoms in response to identifiable stressor(s), within 3 months of onset. Marked distress out of proportion to stressor severity and/or significant functional impairment. Not meeting criteria for another mental disorder.',p:["When did things start to feel off? What was happening in your life around that time?","Walk me through the stressor — was it one thing, or several things stacking up?","How does the way you've been handling this compare to how you typically deal with difficult situations?","Has the stressor resolved, improved, or is it still active?","What does your functioning look like right now — work, home life, sleep, flying duties?"],am:'60-day rule: resolution within 60 days and return to full duty → no waiver required. Beyond 60 days or higher level of care → disqualifying, waiver required. No mandated stability period for trained aircrew (FS/MHP discretion).'},
'X.A.sc':{c:'PHQ-2 two-item screen: depressed mood and anhedonia over the past two weeks.',p:["Over the past two weeks, how often have you felt down, depressed, or hopeless?","Over the past two weeks, how often have you had little interest or pleasure in doing things?"],am:'PHQ-2 ≥3 indicates need for full evaluation. Screen early — depression is the most commonly missed diagnosis in aviation evals.'},
'X.A.A1':{c:'Depressed mood most of the day, nearly every day, by subjective report or observation.',p:["How would you describe your mood over the past couple of weeks — most of the day, most days?","Have there been stretches where you felt persistently down, sad, empty, or hopeless?","Have others commented on a change in your mood or how you seem?"],am:'In aviators, depression often presents as irritability, risk-taking, or squadron withdrawal rather than overt sadness. Collateral from supervisors and peers is valuable.'},
'X.A.A2':{c:'Markedly diminished interest or pleasure in all, or almost all, activities most of the day, nearly every day.',p:["Have things you used to enjoy stopped being enjoyable — hobbies, flying, time with family, social activities?","Is there anything that still brings you genuine pleasure or that you look forward to?","When did you last remember feeling genuinely engaged or interested in something?"],am:'Loss of interest in flying is a particularly important signal — it represents loss of motivation for a highly valued identity.'},
'X.A.A3':{c:'Significant weight loss or gain when not dieting, or decrease/increase in appetite nearly every day (>5% body weight in a month).',p:["Has your appetite changed — eating more or less than usual?","Have you had any noticeable weight change in the past month or two without trying?"],am:'Weight changes can affect flight physiology and G-tolerance. Document with actual weights when possible.'},
'X.A.A4':{c:'Insomnia or hypersomnia nearly every day.',p:["How has your sleep been — getting enough, too much, or poor quality?","Are you having trouble falling asleep, staying asleep, or waking too early?","Are you sleeping much more than usual and still not feeling rested?"],am:'Sleep disruption has direct aeromedical implications. Distinguish from insomnia disorder — the question here is whether depression is driving the sleep change.'},
'X.A.A5':{c:'Psychomotor agitation or retardation nearly every day — observable by others, not merely subjective.',p:["Have others noticed you moving or speaking more slowly than usual?","Have you felt restless, unable to sit still, or revved up uncomfortably?","Has your reaction time or processing speed felt different?"],am:'Psychomotor retardation has direct cockpit implications — reaction time and decision speed. This criterion requires observable signs, not just self-report.'},
'X.A.A6':{c:'Fatigue or loss of energy nearly every day.',p:["How is your energy level — does it take more effort than usual to do ordinary tasks?","Are you feeling tired even after adequate sleep?","Have things that used to be automatic become effortful?"],am:'Distinguish depressive fatigue (present even at rest, worse in morning) from medical causes, sleep disorders, and operational fatigue.'},
'X.A.A7':{c:'Feelings of worthlessness or excessive or inappropriate guilt nearly every day.',p:["Have you been feeling down on yourself, worthless, or like a failure?","Have you been experiencing guilt that seems out of proportion to anything you actually did?","Do you feel like you are a burden to others?"],am:'In military aviators, guilt often presents as perceived failure in duty or letting down the unit — listen for these framings specifically.'},
'X.A.A8':{c:'Diminished ability to think or concentrate, or indecisiveness, nearly every day.',p:["Has your ability to focus, concentrate, or think clearly changed?","Are you finding it harder to make decisions, even small ones?","How is concentration specifically in the cockpit — instrument scan, radio, task management?"],am:'Concentration and decision-making are core cockpit competencies. Ask specifically about in-cockpit concentration — this criterion is directly disqualifying if significantly impaired.'},
'X.A.A9':{c:'Recurrent thoughts of death, recurrent suicidal ideation without a plan, or a suicide attempt or specific plan.',p:["Have you had any thoughts of death or dying — wishing you were dead, or that things would be easier if you weren't here?","Have you had any thoughts of hurting or killing yourself?","Have you made any plans, or done anything to act on those thoughts?"],am:'Full Columbia C-SSRS should follow any positive response. Aircraft-as-means assessment is specifically required for aviators. This is a mandatory immediate safety assessment trigger.'},
'X.A.dur':{c:'Symptoms present during the same 2-week period, representing a change from previous functioning.',p:["How long have these symptoms been present together — can you pinpoint when things started to change?"],am:''},
'X.A.imp':{c:'Symptoms cause clinically significant distress or impairment in social, occupational, or other important areas of functioning.',p:["How much have these symptoms been affecting your daily functioning — work, relationships, home life?","Has your performance at work changed? Have supervisors or peers noticed anything?","Has flying felt different — concentration, confidence, enjoyment, or safety awareness?"],am:'Functional impairment in aviation duties is the critical aeromedical question. Assess specifically for cockpit performance changes, not just general life functioning.'},
'X.A.spec':{c:'Specifiers: anxious distress, mixed features, melancholic features, atypical features, psychotic features, seasonal pattern.',p:["Is there a particular time of year when you tend to get low — fall or winter?","Has this episode included any unusual perceptual experiences or beliefs?","Are there significant anxiety or activation symptoms alongside the depression?"],am:'Mixed features (hypomanic/manic symptoms during a depressive episode) raises the possibility of bipolar spectrum and significantly changes the aeromedical disposition.'},
'X.A.pdd':{c:'Persistent Depressive Disorder: depressed mood more days than not for ≥2 years. Less severe than MDD but chronic. ≥2 of: poor appetite/overeating, insomnia/hypersomnia, low energy, low self-esteem, poor concentration, hopelessness.',p:["Have you felt this way — a kind of low-grade persistent depression — for most of the past two years or longer?","Does this feel more like your baseline state than an episodic change?","When is the last time you remember feeling genuinely good for two months or more?"],am:'PDD can remit to waiver eligibility. The chronic nature means impairment may be normalized by the aviator — baseline comparisons are essential.'},
'X.A.sui':{c:'Full Columbia C-SSRS: ideation type (passive wish for death → active with plan and intent), behavior (preparatory acts, aborted/interrupted/actual attempts), lethality, deterrents, and aircraft-as-means assessment.',p:["Have you ever had thoughts of ending your life?","Have you thought about a specific method or plan?","Have you taken any steps toward acting on those thoughts?","Have you had any thoughts involving your aircraft — taking it somewhere, or using it to end your life?","What has kept you safe when those thoughts have been present?"],am:'Aircraft-as-means assessment is non-negotiable for all aviators with any suicidal ideation. Command notification obligations must be considered in parallel.'},
'X.B.sc':{c:'Screening for bipolar spectrum. Key indicators: distinct elevated/expansive periods, decreased sleep with increased energy, out-of-character impulsive behavior during elevated states.',p:["Have you ever had periods when your mood was distinctly elevated — clearly different from your usual self?","During those times, did you need less sleep but have more energy?","Have you done things during those periods that were out of character?"],am:''},
'X.B.A':{c:'Distinct period of abnormally and persistently elevated, expansive, or irritable mood AND increased goal-directed activity or energy. Manic: ≥7 days. Hypomanic: ≥4 consecutive days.',p:["Tell me about times when your mood was clearly elevated — unusually euphoric, expansive, or confident.","During those periods, was your energy and productivity significantly higher than your normal level?","Were there periods of pronounced irritability — charged, reactive, distinct from ordinary stress?","How long did these periods last?"],am:'Bipolar I and II are not recommended for waiver by ACS — ever. Confirming the A criterion triggers full episode characterization.'},
'X.B.B1':{c:'Inflated self-esteem or grandiosity — from mildly elevated confidence to frank delusions of special powers.',p:["During those elevated periods, did you have an unusual sense of confidence or special ability?","Did anyone around you comment on your confidence seeming inflated or unusual?"],am:''},
'X.B.B2':{c:'Decreased need for sleep — feels rested after only 3 hours. Distinguished from insomnia by feeling energized rather than wanting more sleep.',p:["During those elevated periods, were you sleeping much less — 2, 3, 4 hours — and waking feeling genuinely rested and energized?","Was there a sense that you didn't need sleep, rather than that you couldn't sleep?"],am:'Decreased need for sleep with maintained or increased energy is highly specific for manic/hypomanic episode.'},
'X.B.B3':{c:'More talkativeness than usual, or pressure to keep talking — rapid, loud, difficult to interrupt.',p:["During those periods, did others notice you talking more or more rapidly?","Did you feel a sense of pressure to get your thoughts out?"],am:''},
'X.B.B4':{c:'Flight of ideas or subjective experience that thoughts are racing.',p:["During those periods, did your thoughts seem to speed up — jumping quickly from one idea to another?","Did it feel like your mind was going faster than you could keep track of?"],am:''},
'X.B.B5':{c:'Distractibility — attention too easily drawn to unimportant or irrelevant external stimuli.',p:["Were you unusually distractible during those periods — attention pulled to things that wouldn't normally catch it?"],am:'Distractibility in the cockpit is a direct safety concern during any active manic or hypomanic episode.'},
'X.B.B6':{c:'Increase in goal-directed activity or psychomotor agitation — many projects, working unusual hours, high driven productivity.',p:["During those elevated periods, did you take on many more projects or goals than usual?","Were you working at unusual hours feeling productive and driven?","Did it feel like you couldn't slow down?"],am:''},
'X.B.B7':{c:'Excessive involvement in activities with high potential for painful consequences — buying sprees, sexual indiscretions, foolish investments, excessive risk-taking.',p:["During those elevated periods, did you engage in activities that seemed impulsive or risky in retrospect?","Looking back, were there decisions made during those times you wouldn't have made at baseline?"],am:'Risk-taking behavior in aviation during elevated mood — pushing weather, fuel limits, aggressive flying — is a critical aeromedical red flag.'},
'X.B.hypo':{c:'Hypomanic episode: same criteria as manic but ≥4 days (not 7), observable by others, not severe enough to cause marked impairment, no psychotic features.',p:["Were any elevated periods just a few days — 4-7 days — rather than longer?","During those times, would others have noticed a clear change in you, but things still held together?","Were there hypomanic periods followed by depressive crashes?"],am:'Bipolar II carries the same ACS non-waiver position as Bipolar I. Hypomania is ego-syntonic and remembered positively — ask carefully.'},
'X.B.mixed':{c:'Mixed features specifier: manic/hypomanic episode with ≥3 depressive symptoms simultaneously; or depressive episode with ≥3 manic/hypomanic symptoms.',p:["Were there periods when you felt elevated and driven, but also anxious, irritable, and unhappy at the same time?","Has there been a time when depression and activation seemed to occur simultaneously — agitated, restless, and dark all at once?"],am:'Mixed features significantly worsen prognosis and increase suicide risk. Complicates antidepressant treatment.'},
'X.B.soft':{c:'Soft bipolar spectrum: hyperthymic temperament, cyclothymia, BP-NOS. Below formal threshold but represents biological vulnerability to mood cycling.',p:["Has your temperament always involved periods of being especially high-energy and productive, alternating with lower periods?","Is there a family history of bipolar disorder?","Have antidepressants ever caused agitation, activation, or something that felt like a manic response?"],am:'Soft bipolar spectrum does not automatically trigger the ACS non-waiver position but requires careful documentation and clinical judgment.'},
'X.C.hall':{c:'Hallucinations: sensory perceptions without external stimulus. Auditory most common (voices commenting, commanding, conversing). Also visual, tactile, olfactory, gustatory.',p:["Have you ever heard things — voices or sounds — that other people around you couldn't hear?","Have you ever seen things that others couldn't see?","Have any of these experiences occurred while you were fully awake, rather than falling asleep or waking?"],am:'Any frank hallucination in a waking, alert state is immediately disqualifying. Distinguish from hypnagogic/hypnopompic phenomena (normal at sleep onset/offset).'},
'X.C.del':{c:"Delusions: fixed false beliefs held with certainty, not shared by cultural group. Types: persecutory, referential, somatic, grandiose, erotomanic, nihilistic, jealous.",p:["Have you had beliefs that others told you weren't true, but that you felt absolutely certain about?","Have you had a sense that things in your environment contained special messages directed at you specifically?","Have you had a sense that people were following you, monitoring you, or conspiring against you?"],am:"Delusions are permanently disqualifying. Aviation's complex information environment makes paranoid or referential delusions catastrophically dangerous."},
'X.C.dis':{c:"Disorganized thinking (tangentiality, loose associations, derailment) manifesting as disorganized speech. Also disorganized behavior.",p:["Have others told you they had trouble following your thinking?","Have you noticed your thinking feeling scattered, jumping between unrelated topics in a way you couldn't control?"],am:'Formal thought disorder is incompatible with aviation duties.'},
'X.C.neg':{c:'Negative symptoms: diminished emotional expression, avolition, alogia, anhedonia, asociality. Represent loss of normal function.',p:["Have you noticed a flattening of your emotions — feeling less, reacting less, expressing less than you used to?","Have you had extended periods of profound loss of motivation — not depression, but a kind of absence of drive?"],am:'Negative symptoms are often mistaken for depression or personality change. They suggest a more ominous prognostic picture.'},
'X.C.dx':{c:'Differential: schizophrenia (≥6 months), schizophreniform (1-6 months), schizoaffective (mood + psychotic), brief psychotic disorder (<1 month), substance-induced, due to medical condition.',p:["How long have these experiences been present in total — including earlier, milder versions?","Have there been significant mood episodes alongside the psychotic symptoms?","Is there any substance use that could account for these experiences?"],am:'Duration and context determine both diagnosis and waiver potential. Substance-induced or medically-induced psychosis with reversible etiology may have a limited pathway.'},
'X.C.att':{c:'Attenuated Psychosis Syndrome: delusion-like ideas, hallucination-like perceptions, or disorganized speech below threshold in frequency, intensity, or conviction. High risk of conversion.',p:["Have you had experiences that felt like they might be perceptual or belief disturbances but weren't quite full hallucinations — things you could still reality-test?"],am:'APS represents a prodromal state with meaningful conversion risk. Warrants careful aeromedical monitoring.'},
'X.D.gad':{c:'Excessive anxiety and worry about multiple events, more days than not for ≥6 months, difficult to control. ≥3 of 6: restlessness, fatigue, poor concentration, irritability, muscle tension, sleep disturbance.',p:["What do you tend to worry about most? Is it one particular thing, or does it move across a lot of different areas?","When a worry comes up, can you set it aside and move on, or does it tend to take hold and run?","How long has this been your pattern — months, longer?","Does your body carry it — tension, restlessness, trouble settling, sleep problems?","How much of your day does worrying take up? Has it gotten in the way at work or in the cockpit?"],am:'Rule out caffeine and energy drink load, sleep disruption, and medical causes (thyroid, stimulants, cardiac) before settling on GAD. Common and easily missed in aviation populations.'},
'X.D.pan':{c:'Recurrent unexpected panic attacks: abrupt surge of intense fear peaking within minutes, ≥4 symptoms. ≥1 month of persistent concern about recurrence or significant behavior change.',p:["Have you had sudden episodes of intense fear or alarming physical symptoms that came out of nowhere — heart pounding, trouble breathing, dizziness?","Did it peak within a few minutes?","Have you changed anything about what you do to avoid having another one?","Have you ever had one while flying or in a situation related to flying?"],am:'In-flight panic attack is a direct aeromedical concern. Vestibular and cardiovascular causes must be excluded. Avoidance behavior directed at flying is a significant red flag.'},
'X.D.soc':{c:'Marked fear in social situations where scrutiny is possible. Fears humiliation or embarrassment. Situations avoided or endured with intense anxiety. ≥6 months.',p:["How are you in situations where you feel evaluated or judged — briefings, checkrides, formal settings with senior officers?","Is there a specific fear of doing something embarrassing, or of being seen as anxious or weak?","Do you avoid certain situations because of this, or push through with a lot of anxiety?"],am:'Checkride performance, CRM effectiveness, and crew coordination are directly relevant contexts. Distinguish from introversion and normal performance nerves.'},
'X.D.phob':{c:'Marked fear about specific object or situation, immediately provoked, actively avoided or endured, out of proportion to actual danger. ≥6 months.',p:["Are there specific things that reliably trigger intense fear — heights, weather, instrument conditions, night flying, specific aircraft types?","When that happens, what do you actually do — push through it, get out, avoid?","Has it changed anything about how or what you fly?"],am:'Flying-specific phobias are directly disqualifying if they impair performance or safety. Distinguish from appropriate situational caution.'},
'X.D.sep':{c:'Excessive fear about separation from attachment figures, developmentally inappropriate. ≥6 months, causing significant distress or functional impairment.',p:["How do you do being away from home for extended periods — deployments, TDY, long exercises?","Has this affected your willingness to deploy, or how you function when you are deployed?"],am:'Deployment readiness is directly relevant to military aviation fitness and suitability.'},
'X.E.obs':{c:'Obsessions: recurrent, persistent, intrusive, unwanted thoughts, urges, or images causing marked anxiety. Common themes: contamination, harm, symmetry, forbidden/taboo thoughts.',p:["Do you have recurrent intrusive thoughts, images, or urges that come into your mind against your will and cause distress?","Do you recognize these thoughts as coming from your own mind, even though they feel alien or unwanted?"],am:'Intrusive thoughts about causing harm to others in a safety-critical aviation environment are a significant aeromedical concern regardless of insight level.'},
'X.E.comp':{c:'Compulsions: repetitive behaviors or mental acts performed in response to an obsession or rigid rule. Aimed at preventing or reducing distress — clearly excessive.',p:["Do you perform repetitive behaviors or rituals in response to those intrusive thoughts — checking, washing, counting, arranging?","How much time do these behaviors take up in a typical day?"],am:'Checking compulsions may be partially concealed by aviation checklist culture. Ask specifically about behavior that goes beyond normal checklist discipline.'},
'X.E.spec':{c:'Specifiers: good/fair/poor/absent insight. Tic-related. Severity: mild (<1h/day), moderate (1-3h/day), severe (>3h/day).',p:["How much do you believe the feared consequences would occur if you didn't perform the compulsion?","How many hours a day do these thoughts and rituals take up?"],am:'Severity in hours/day is directly relevant to functional capacity in aviation duties.'},
'X.E.rel':{c:'OCD-spectrum: Body Dysmorphic Disorder, Hoarding Disorder, Trichotillomania, Excoriation Disorder.',p:["Have you had significant preoccupation with a perceived flaw in your appearance that others said was minor or couldn't see?","Have you had difficulty discarding possessions to the point it affects your functioning?","Have you had repetitive pulling of hair or picking at skin that has been difficult to stop?"],am:''},
'X.F.A':{c:'Criterion A: Exposure to actual or threatened death, serious injury, or sexual violence by direct experience, witnessing, or learning it occurred to close others.',p:["Tell me about any experiences where you were exposed to death, serious injury, or violence — directly or as a witness.","Have you been in combat, accidents, or other life-threatening situations?","Have you had significant exposure to the aftermath of traumatic events through your work?"],am:'Military aviators may minimize combat exposure as part of the job. Probe specifically for combat, mishaps, CSAR, and other high-exposure roles.'},
'X.F.B1':{c:'Recurrent, involuntary, and intrusive distressing memories of the traumatic event.',p:["Do memories of the event come back to you involuntarily — not when you choose to think about it, but when they push into your mind?"],am:''},
'X.F.B2':{c:'Recurrent distressing dreams in which content or affect is related to the traumatic event.',p:["Are you having recurrent nightmares — directly about the event or with similar themes?","How often, and how distressing?"],am:'Trauma-related nightmares disrupt sleep and have direct daytime alertness implications for cockpit performance.'},
'X.F.B3':{c:'Dissociative reactions (flashbacks) in which the person feels or acts as if the traumatic event is recurring.',p:["Have you had experiences where you felt like you were back at the event — not just remembering it, but reliving it?"],am:'Flashback episodes in the cockpit represent an acute incapacitation risk. Ask specifically about any dissociative experiences during flying.'},
'X.F.B4':{c:'Intense or prolonged psychological distress at exposure to cues that symbolize or resemble an aspect of the traumatic event.',p:["Are there specific reminders — smells, sounds, places, situations — that trigger significant distress?","Do certain cockpit sounds or operational scenarios bring up the trauma?"],am:''},
'X.F.B5':{c:'Marked physiological reactions (racing heart, sweating, trembling) to cues resembling the traumatic event.',p:["When you encounter reminders of the event, does your body react — heart racing, sweating, trembling?"],am:'Physiological reactivity to flight-relevant cues is a significant aeromedical concern.'},
'X.F.C1':{c:'Efforts to avoid distressing memories, thoughts, or feelings about the traumatic event.',p:["Do you find yourself avoiding thinking about the event — pushing thoughts away, keeping busy to avoid memories?"],am:''},
'X.F.C2':{c:'Efforts to avoid external reminders — people, places, conversations, activities, objects — that arouse distressing memories.',p:["Are there places, situations, or people you actively avoid because they're connected to the event?","Has this avoidance limited what you're willing to do?"],am:'Avoidance of aviation-related cues or scenarios is a red flag for return-to-flying readiness.'},
'X.F.D1':{c:'Inability to remember an important aspect of the traumatic event (dissociative amnesia, not due to head injury or substances).',p:["Are there gaps in your memory of the event — things you know happened that you simply can't recall?"],am:''},
'X.F.D2':{c:'Persistent and exaggerated negative beliefs or expectations about oneself, others, or the world.',p:["Have your beliefs about yourself changed since the event — a sense of being damaged, fundamentally changed, or unable to trust yourself?","How do you view others and the world since the event?"],am:''},
'X.F.D3':{c:'Persistent, distorted cognitions about the cause or consequences of the event that lead to self-blame or blaming others.',p:["Do you blame yourself for the event or its outcome in a way others would say is distorted?","Are there things you tell yourself you should have done differently that remain persistent and painful?"],am:'Moral injury often presents through this criterion — particularly in aviators carrying responsibility for complex operational outcomes.'},
'X.F.D4':{c:'Persistent negative emotional state — fear, horror, anger, guilt, or shame.',p:["Since the event, have you been carrying persistent feelings of fear, anger, guilt, or shame that feel stuck?"],am:''},
'X.F.D5':{c:'Markedly diminished interest or participation in significant activities.',p:["Have things you cared about — flying, hobbies, relationships — become less interesting since the event?"],am:''},
'X.F.D6':{c:'Feelings of detachment or estrangement from others.',p:["Do you feel emotionally disconnected or cut off from people close to you — even when physically present?"],am:''},
'X.F.D7':{c:'Persistent inability to experience positive emotions — happiness, love, satisfaction, interest.',p:["Have positive emotions become harder to access or sustain since the event?"],am:''},
'X.F.E1':{c:'Irritable behavior and angry outbursts with little or no provocation.',p:["Have you been more irritable or prone to anger since the event — reacting more strongly than the situation warrants?","Have there been outbursts or aggressive reactions that were out of character?"],am:'Irritability and anger in a cockpit crew environment has direct CRM and mission safety implications.'},
'X.F.E2':{c:'Reckless or self-destructive behavior — reckless driving, substance use, self-harm, dangerous activities.',p:["Have you engaged in behaviors that put you at risk — driving recklessly, drinking more, taking unnecessary chances?","Has your approach to risk changed since the event?"],am:'Reckless behavior in aviation operations is a specific critical aeromedical concern. Ask directly about in-aircraft behavior changes.'},
'X.F.E3':{c:'Hypervigilance — excessive alertness to threat, scanning for danger.',p:["Have you been on guard or alert much of the time — scanning for threats, unable to relax in public?"],am:'Hypervigilance in aviation can manifest as excessive scanning, threat misattribution, or attentional narrowing.'},
'X.F.E4':{c:'Exaggerated startle response to unexpected stimuli.',p:["Have you been startling more easily than before — to sounds, movement, or surprises?","Is the startle response significantly stronger than before the event?"],am:'Exaggerated startle to cockpit sounds (alarms, ATC calls, system warnings) has direct safety implications.'},
'X.F.E5':{c:'Problems with concentration — difficulty focusing, maintaining attention, completing tasks.',p:["Has concentration become more difficult since the event?","Are there specific settings — cockpit, briefings — where concentration difficulty is most apparent?"],am:'Concentration difficulties in the cockpit are directly aeromedically relevant.'},
'X.F.E6':{c:'Sleep disturbance — difficulty falling or staying asleep, restless sleep.',p:["How is your sleep since the event — falling asleep, staying asleep, feeling rested?"],am:'Sleep disruption has direct daytime alertness and cockpit performance implications.'},
'X.F.FGH':{c:'F: Duration >1 month. G: Significant distress or functional impairment. H: Not attributable to substance or medical condition.',p:["How long have these symptoms been present in total?","How much has this been affecting your functioning — work, relationships, flying duties?","Is there any substance use or medical condition that could account for these symptoms?"],am:''},
'X.F.spec':{c:'Dissociative subtype: depersonalization or derealization. Delayed expression: full criteria not met until ≥6 months after event.',p:["Have you had experiences of feeling detached from yourself — watching yourself from outside?","Have you had experiences of the world seeming unreal or dreamlike?"],am:'Dissociative subtype has a more complex treatment course. Dissociative experiences during flight represent an incapacitation risk.'},
'X.F.cptsd':{c:'Complex PTSD (ICD-11): PTSD plus disturbances in self-organization — affect dysregulation, negative self-concept, relationship disturbances. Associated with prolonged or repeated trauma.',p:["Was the trauma prolonged or repeated, rather than a single incident?","Beyond the PTSD symptoms, are there persistent difficulties managing emotions or a deep sense of being damaged?"],am:''},
'X.F.moral':{c:'Moral injury: damage to moral conscience from perpetrating, failing to prevent, or witnessing acts that violate deeply held moral beliefs. Guilt, shame, loss of meaning. Overlaps with but is distinct from PTSD.',p:["Were there aspects of the event — things you did, failed to do, or witnessed — that violated your sense of what was right?","Has the event left you with guilt or shame that goes beyond fear — more about the moral weight of what happened?","Has your sense of meaning, purpose, or faith been affected?"],am:'Moral injury is prevalent in combat aviators and those involved in mishaps with casualties. Exposure therapy may not adequately address moral injury — different treatment approach.'},
'X.G.dp':{c:'Depersonalization: detachment from thoughts, feelings, body. Derealization: surroundings feel unreal, dreamlike, foggy.',p:["Have you had experiences of feeling detached from yourself — like watching yourself from outside?","Have you had experiences where your surroundings felt unreal or dreamlike?","During or after stress, have you felt like you were in a fog or operating on autopilot?"],am:'Dissociative episodes during flight represent acute incapacitation risk. Derealization may affect spatial orientation and situational awareness.'},
'X.G.am':{c:'Dissociative amnesia: inability to recall autobiographical information inconsistent with ordinary forgetting.',p:["Are there significant gaps in your memory — events or periods of time you should be able to remember but can't?","Have you ever found yourself somewhere or having done something with no recollection of how?"],am:''},
'X.G.did':{c:'DID features: disruption of identity with two or more distinct personality states. Gaps in recall of everyday events.',p:["Have you ever been told about behaviors or conversations you had no memory of?","Have others described you as seeming like a different person at certain times?"],am:'DID is incompatible with flying duties. Identity disruption and amnesia represent categorical incapacitation risks.'},
'X.G.peri':{c:'Peritraumatic dissociation: dissociative experiences during or immediately after a traumatic event. Strong predictor of PTSD development.',p:["During the traumatic event itself, did you feel detached from it — like watching it from outside yourself?","Are there gaps in your memory of the event that occurred in the moment itself?"],am:''},
'X.H.alc':{c:'AUD criteria (≥2 of 11): tolerance, withdrawal, more/longer than intended, persistent desire to cut down, time spent, activities given up, continued use despite problems.',p:["Walk me through your relationship with alcohol over the past year.","Have you ever tried to cut back or stop and found it difficult?","Have you found you need more alcohol to get the same effect?","Have you kept drinking despite it causing problems?","Have you ever had symptoms when you stopped or cut back — shaking, sweating, anxiety?"],am:'Any alcohol-related diagnosis triggers full abstinence machinery. Bottle-to-throttle minimum 12 hours — optimally 3 days. CDT and PEth are key biomarkers.'},
'X.H.btl':{c:'Use of alcohol within bottle-to-throttle period (USAF minimum 12 hours). Post-alcohol impairment persists up to 72 hours. Positional alcohol nystagmus under G-load up to 48 hours.',p:["Have you ever flown within 12 hours of drinking?","Have you flown while still feeling the effects of alcohol — including a hangover?","Have you ever had a drink during a flight?"],am:'Bottle-to-throttle violation is a mandatory reporting event. Hangover effects can impair performance for up to 72 hours. Positional alcohol nystagmus is a specific G-flying risk.'},
'X.H.wd':{c:'Alcohol withdrawal: autonomic hyperactivity, tremor, insomnia, nausea, agitation, anxiety, seizures, delirium tremens. Onset 6-24 hours after last drink.',p:["Have you ever had symptoms when you stopped or cut back on drinking — shaking, sweating, anxiety, racing heart?","Have you ever had a seizure or confusion when stopping?"],am:'Alcohol withdrawal seizure or delirium tremens is almost certainly permanently disqualifying. Withdrawal history indicates severity of dependence.'},
'X.H.ari':{c:'Alcohol-Related Incident: any incident where alcohol was a contributing factor (DUI, domestic, workplace, conduct).',p:["Have you ever had any incident — legal, domestic, workplace, or command — where alcohol was involved?","Have you ever been stopped while driving after drinking?"],am:'Two or more ARIs, or one ARI with extreme behavior, may trigger compelled abstinence with FS monitoring even without formal AUD diagnosis.'},
'X.H.stim':{c:'Stimulant use disorder (cocaine, methamphetamine): tolerance, withdrawal, continued use despite problems.',p:["Have you ever used cocaine, methamphetamine, or other stimulants?","Have you used any stimulants not prescribed to you?"],am:'Any history of stimulant-induced psychosis is permanently disqualifying. Cocaine use carries cardiac arrhythmia risk relevant to G-tolerance.'},
'X.H.cann':{c:'Cannabis use disorder: tolerance, withdrawal, continued use despite impairment. THC impairs cognition and psychomotor performance for hours to days.',p:["Have you used cannabis — marijuana, THC — in any form?","How frequently and in what amounts?"],am:'Any cannabis use while holding a flying assignment is disqualifying. THC can impair cognitive performance for 24+ hours after use.'},
'X.H.opi':{c:'Opioid use disorder: tolerance, withdrawal, craving, continued use despite impairment. Includes prescription opioid misuse.',p:["Have you used opioids beyond what was prescribed, or for non-pain reasons?","Have you had to take more to get the same effect?"],am:'Prescription opioid misuse is common and often not volunteered — ask directly and specifically.'},
'X.H.sed':{c:'Sedative/hypnotic/anxiolytic use disorder: tolerance, withdrawal, continued use despite impairment. Includes benzodiazepines, Z-drugs.',p:["Have you used sleeping pills, anti-anxiety medications, or sedatives beyond what was prescribed?","Have you needed to take more to get the same effect?"],am:'Benzodiazepine and Z-drug use is not aeromedically approved. Withdrawal can cause seizures.'},
'X.H.pes':{c:'Performance-enhancing substances: anabolic steroids, HGH, SARMs, peptide hormones. May indicate character issues beyond the substance itself.',p:["Have you ever used substances to enhance physical performance — steroids, HGH, SARMs?"],am:'Anabolic steroid use has cardiac implications relevant to G-tolerance. Character implications of using prohibited substances are equally significant.'},
'X.H.rxs':{c:'Prescription stimulant use: methylphenidate, amphetamine salts. No stimulant medication is aeromedically approved.',p:["Have you ever been prescribed a stimulant — Adderall, Ritalin, Vyvanse, or similar?","When was the last time you took a stimulant and what was the dose?"],am:'No stimulant is aeromedically approved for any indication in aviation. Minimum 12 months off medication with demonstrated stability required before any waiver consideration.'},
'X.H.tob':{c:'Tobacco use disorder: nicotine dependence, withdrawal. Includes cigarettes, smokeless, vaping, pouches.',p:["Do you use tobacco or nicotine in any form?","Have you tried to quit and found it difficult?"],am:'Nicotine withdrawal can impair concentration and mood during cessation attempts. Bupropion (Wellbutrin) is aeromedically approved for smoking cessation.'},
'X.I.ia':{c:'Inattentive symptoms (≥6 required, ≥5 if ≥17 years): careless mistakes, difficulty sustaining attention, fails to follow through, disorganized, avoids sustained mental effort, loses things, easily distracted, forgetful.',p:["Walk me through what inattention looks like for you in a typical day — at work, at home, in the cockpit.","Do you make careless mistakes, have difficulty sustaining attention, or frequently lose things?","Is it hard to follow through on tasks from start to finish, especially ones requiring sustained mental effort?","How do you manage organization — calendars, lists, systems — and what happens without them?"],am:'Cockpit-specific inattention profile is the critical aeromedical question: instrument scan, checklist discipline, radio monitoring, task saturation management.'},
'X.I.hi':{c:'Hyperactive-impulsive symptoms (≥6 required, ≥5 if ≥17): fidgets, leaves seat, talks excessively, blurts answers, difficulty waiting, interrupts/intrudes.',p:["Have you tended to act before thinking — making impulsive decisions, blurting things out?","Have others described you as restless, constantly on the move, or driven?","In the cockpit, do you find yourself acting impulsively under pressure?"],am:'Impulsivity in aviation is particularly dangerous — evaluate specifically for impulsive decision-making under task saturation or time pressure.'},
'X.I.ch':{c:'Several symptoms present before age 12. Required for ADHD diagnosis — differentiates from adult-onset attention problems due to depression, anxiety, sleep, or substance use.',p:["When you look back at childhood and school, were these patterns present then?","Were you described as inattentive, restless, or impulsive by teachers or parents?","Do you have school records or report cards that document attention difficulties?"],am:'Childhood onset verification is clinically essential. Academic records and parent/sibling collateral are valuable corroborating sources.'},
'X.I.ad':{c:'Adult ADHD manifestation in aviation: instrument scan fatigue, checklist errors, radio monitoring failures during high workload, task saturation, impulsive tactical decisions, situational awareness failures.',p:["How do you manage the demands of the cockpit in high-workload situations?","Have you made errors in the cockpit that you attributed to inattention or being pulled off task?","How have checkrides and standardization evaluations commented on your attention and procedure adherence?"],am:'The cockpit-specific ADHD profile is the core aeromedical question. Superior performance in routine conditions may mask ADHD that becomes apparent in high-demand or novel scenarios.'},
'X.I.med':{c:'ADHD medication history: stimulant and non-stimulant medications, dosing, duration, prescribing provider, response, current status.',p:["Walk me through your medication history for ADHD — what were you prescribed, at what dose, for how long?","Who prescribed it and what was the indication?","When did you stop, and how have you functioned since?","Have you used anyone else's stimulants?"],am:"ACS has not recommended any waiver for ADHD controlled on stimulant or non-stimulant medication. Off-medication stability ≥12 months required. Document the last dose date explicitly."},
'X.I.aA':{c:'ASD Criterion A: deficits in social-emotional reciprocity, nonverbal communication, and developing/maintaining relationships. Must be present across multiple contexts.',p:["How do you navigate social situations — reading nonverbal cues, understanding others' perspectives, back-and-forth conversation?","Have you had persistent difficulty forming or maintaining relationships?","Do others describe you as difficult to read or hard to connect with?"],am:'Crew coordination and CRM effectiveness depend on social communication ability.'},
'X.I.aB':{c:'ASD Criterion B: stereotyped behaviors, insistence on sameness/inflexible routines, highly restricted interests, hypo/hypersensitivity to sensory input.',p:["Do you have very strong, narrow interests that dominate your time and thinking?","Do you rely heavily on routines and become significantly distressed when they're disrupted?","Are you sensitive to sensory input — sounds, lights, textures — in a way that interferes with functioning?"],am:'Inflexibility to changes in plan or procedure in aviation can be dangerous. Sensory sensitivity may affect cockpit environment tolerance.'},
'X.I.mask':{c:'ASD masking/camouflaging: consciously or unconsciously suppressing autistic traits to appear neurotypical. May maintain surface function while experiencing significant internal effort and burnout.',p:["Do you feel like you have to work very hard to appear socially normal — mimicking others, scripting conversations?","Have you experienced burnout — exhaustion from the effort of appearing typical?"],am:'Masking can understate functional impact. High-demand aviation environments may exceed masking capacity and reveal deficits not apparent in routine evaluation.'},
'X.I.ld':{c:'Specific Learning Disorder: difficulties in reading, written expression, or mathematics in the context of adequate intelligence. Persistent ≥6 months, significantly below expected level.',p:["Have you had persistent difficulties with reading, writing, or math that were significantly below expectations?","Did you receive special education services, IEPs, or accommodations in school?"],am:'Learning disorders requiring academic accommodations create a waiver pathway question — 4+ years of achievement without accommodations required.'},
'X.I.dcd':{c:'Developmental Coordination Disorder: significant impairment in acquisition and execution of coordinated motor skills, interfering with activities or academic performance.',p:["Have you had significant and persistent difficulties with motor coordination — sports, driving, fine motor tasks?","Has this been a consistent pattern across your life?"],am:'Fine and gross motor coordination is directly relevant to aviation duties. DCD affecting aircraft control inputs or emergency procedures has direct aeromedical implications.'},
'X.J.A':{c:'Cluster A: Paranoid PD (pervasive distrust), Schizoid PD (detachment, restricted affect), Schizotypal PD (social discomfort, cognitive/perceptual distortions, eccentricity).',p:["Do you tend to view others with distrust — feeling people's motives are often hostile even without clear evidence?","Do you strongly prefer to be alone and find close relationships uncomfortable or unnecessary?","Have others described you as eccentric, odd, or having unusual beliefs or perceptual experiences?"],am:'Cluster A features — particularly paranoid traits — are concerning for CRM and crew coordination.'},
'X.J.ASPD':{c:'Antisocial PD: pervasive disregard and violation of rights of others since age 15. ≥3 of: law violations, deceitfulness, impulsivity, aggressiveness, reckless disregard for safety, irresponsibility, lack of remorse.',p:["Tell me about your history with rules, authority, and the law — any arrests, violations, or disciplinary actions?","Have you had a pattern of lying, conning, or using others for personal gain?","Looking back to before age 15 — were there conduct problems, fighting, property destruction?"],am:'ASPD is among the most serious aeromedical character concerns. Reckless disregard for safety of others and lack of remorse are directly incompatible with crew safety responsibilities.'},
'X.J.BPD':{c:'Borderline PD: pervasive instability in relationships, self-image, and affect with marked impulsivity. ≥5 of 9 criteria.',p:["How would you describe your emotional life — how quickly your emotions shift, and how intensely you feel them?","Have your relationships tended to be very intense — idealized then dramatically devalued?","Have you engaged in impulsive behaviors that put you at risk?"],am:'Emotional instability, impulsivity, and self-harm history all carry specific aeromedical implications.'},
'X.J.NPD':{c:'Narcissistic PD: pervasive grandiosity, need for admiration, lack of empathy. ≥5 of 9 criteria.',p:["How do you generally view your abilities and achievements relative to others?","Do you find it difficult to recognize or take responsibility when you've contributed to a problem?","Have others described you as lacking empathy or expecting special treatment?"],am:'Narcissistic features are specifically noted by ACS as particularly undesirable in aviators. Inflated self-assessment directly affects adherence to rules and acceptance of subordinate roles.'},
'X.J.Hist':{c:'Histrionic PD: pervasive pattern of excessive emotionality and attention-seeking. ≥5 of 8 criteria.',p:["Do you tend to feel uncomfortable when you're not the center of attention?","Have others described your emotional expressions as theatrical or exaggerated?","Do you tend to see relationships as closer or more intimate than others would describe them?"],am:'Histrionic features can manifest in CRM as attention-seeking behavior and dramatic responses to stress that disrupt crew function.'},
'X.J.C':{c:'Cluster C: Avoidant PD (social inhibition, inadequacy, hypersensitive to criticism), Dependent PD (excessive need to be cared for), OCPD (preoccupation with orderliness, perfectionism, control).',p:["Do you avoid activities because of fear of criticism or rejection?","Do you have significant difficulty making decisions without reassurance from others?","Is there a persistent pattern of perfectionism and rigidity — needing things done your way, difficulty delegating?"],am:'OCPD perfectionism can be adaptive in aviation up to a point, but rigidity and difficulty delegating in crew environments is hazardous.'},
'X.J.dim':{c:'Dimensional personality assessment (PID-5/AMPD): negative affectivity, detachment, antagonism, disinhibition, psychoticism.',p:["Let's look at some personality dimensions: emotional reactivity, tendency toward detachment or connection, antagonism versus agreeableness, impulsivity versus conscientiousness.","How would you rate yourself on each of these compared to most people?"],am:'Dimensional assessment is particularly valuable when full PD criteria are not met but traits are clinically significant — the territory between normal variation and ARMA.'},
'X.J.am':{c:'Aeromedical character concerns: immaturity, impulsivity, inflated self-esteem, high neuroticism, dishonesty. Do not require PD diagnosis to be aeromedically significant — ARMA captures patterns below diagnostic threshold.',p:["Looking at your career, how have you generally handled authority, rules, and supervision?","Have you ever minimized or concealed relevant information from supervisors, medical personnel, or evaluators?","How do you handle feedback and criticism — especially when you disagree with the assessment?"],am:'The ARMA evaluation covers maladaptive personality traits without full PD criteria. Collateral from commanders and peers is essential.'},
'X.K.ssd':{c:'Somatic Symptom Disorder: ≥1 somatic symptom causing distress or disruption. Excessive thoughts, feelings, or behaviors related to symptoms — high health anxiety, disproportionate concern.',p:["Have you had persistent physical symptoms — pain, fatigue, neurological symptoms — that doctors haven't been able to fully explain?","How much time and energy do these physical concerns take up?","How anxious are you about these symptoms?"],am:'12-month stability required before waiver consideration.'},
'X.K.iad':{c:'Illness Anxiety Disorder: preoccupation with having or acquiring a serious illness. Somatic symptoms absent or mild. High health anxiety, excessive health-related behaviors.',p:["Are you significantly worried about having or developing a serious illness despite medical reassurance?","Do you frequently check your body for signs of illness or seek reassurance from doctors?"],am:''},
'X.K.conv':{c:'Conversion Disorder (Functional Neurological Symptom Disorder): ≥1 symptom of altered voluntary motor or sensory function incompatible with neurological disease.',p:["Have you had episodes of weakness, paralysis, involuntary movements, or sensory changes that doctors couldn't explain with a physical cause?","Were these associated with psychological stress?"],am:'Conversion disorder affecting motor or sensory function has direct implications for aircraft control and emergency procedures.'},
'X.K.fact':{c:'Factitious Disorder: falsification of physical or psychological signs or symptoms without obvious external incentives.',p:["Observe: Are there discrepancies between reported symptoms and objective findings that suggest symptom fabrication?"],am:'Factitious disorder is disqualifying and handled administratively as an unsuiting condition.'},
'X.K.mal':{c:'Malingering: intentional production of false or exaggerated symptoms motivated by external incentives (avoiding duty, obtaining medications, financial gain).',p:["Observe: Are there inconsistencies between reported symptoms, observed behavior, and objective findings?","Is symptom presentation influenced by observation — worse when being evaluated?"],am:'Malingering is a Z code — not a mental illness. In military aviation treated as unsuiting under Article 83 UCMJ.'},
'X.L.an':{c:'Anorexia Nervosa: restriction of energy intake leading to significantly low body weight. Intense fear of gaining weight. Disturbance in how body weight or shape is experienced.',p:["What has your relationship with food and eating been like?","Have you significantly restricted what you eat out of concern about weight or shape?","How do you feel about your current body weight?"],am:'Low body weight has direct aeromedical implications: G-tolerance, cognitive performance, cardiovascular function. Eating disorders after age 12 are disqualifying.'},
'X.L.bn':{c:'Bulimia Nervosa: recurrent binge eating AND compensatory behaviors (purging, fasting, exercise). ≥1x/week for 3 months. Self-evaluation unduly influenced by body shape and weight.',p:["Have you had episodes of eating a large amount of food in a short time, with a sense of being out of control?","After those episodes, have you done anything to compensate — vomiting, laxatives, fasting, excessive exercise?"],am:'Electrolyte disturbances from purging can cause cardiac arrhythmias — significant aeromedical concern.'},
'X.L.bed':{c:'Binge Eating Disorder: recurrent binge eating without compensatory behaviors. ≥1x/week for 3 months. Marked distress.',p:["Have you had episodes of eating a large amount in a short time, feeling out of control?","Do these episodes cause significant distress?"],am:'BED commonly co-occurs with depression and anxiety. Weight-related aeromedical concerns (OSA, metabolic syndrome, cardiovascular) are primary.'},
'X.L.arfid':{c:'ARFID: Avoidant/Restrictive Food Intake Disorder. Restriction not related to weight/shape concerns. Based on sensory characteristics, fear of aversive consequences, or lack of interest in eating.',p:["Have you always had a very restricted diet — specific textures, tastes, or types of food you won't eat?","Is the restriction based on sensory properties of food rather than concern about weight?"],am:'Nutritional deficiency and social impairment in deployed environments are the primary aeromedical concerns.'},
'X.M.ins':{c:'Insomnia Disorder: difficulty initiating or maintaining sleep, early morning awakening. ≥3 nights/week for ≥3 months despite adequate opportunity.',p:["What does your sleep look like on a typical night — falling asleep, staying asleep, waking early?","How long has this been going on?","What do you do when you can't sleep?"],am:'Insomnia has direct daytime alertness and cockpit performance implications. CBT-I is preferred treatment — sleep medications generally incompatible with flying.'},
'X.M.hyp':{c:'Hypersomnolence/Narcolepsy: excessive sleepiness despite ≥7 hours sleep. Narcolepsy: cataplexy, sleep paralysis, hypnagogic hallucinations.',p:["Are you excessively sleepy during the day despite adequate nighttime sleep?","Do you have irresistible urges to sleep at inappropriate times?","Have you ever had episodes of sudden muscle weakness triggered by strong emotion?"],am:'Narcolepsy is permanently disqualifying for all flying classes.'},
'X.M.osa':{c:'Obstructive Sleep Apnea: recurrent upper airway obstruction during sleep. Loud snoring, gasping, non-restorative sleep, daytime sleepiness. Confirmed on polysomnography.',p:["Has anyone told you that you snore loudly, stop breathing, or gasp during sleep?","Do you wake unrefreshed despite adequate hours of sleep?","Do you feel excessively sleepy during the day?"],am:'OSA is aeromedically manageable with documented CPAP compliance. Untreated OSA is disqualifying. CPAP compliance data required for waiver.'},
'X.M.para':{c:'Parasomnias: NREM — sleep terrors, sleepwalking. REM — REM sleep behavior disorder (acting out dreams). Nightmare Disorder.',p:["Do you sleepwalk, talk, or do complex behaviors during sleep you have no memory of?","Have you ever acted out dreams — hitting, kicking, moving while asleep?"],am:'REM sleep behavior disorder is associated with neurodegenerative disease and warrants neurological evaluation.'},
'X.M.circ':{c:'Circadian Rhythm Sleep-Wake Disorders: misalignment between circadian rhythm and environment. Types: delayed phase, advanced, shift work, jet lag.',p:["Does your natural sleep timing feel significantly shifted — preferring to sleep and wake very late or very early?","Do you have significant difficulty adjusting to shift work, time zone changes, or irregular duty schedules?"],am:'Circadian disruption has direct aeromedical implications for alertness management in shift-working or rotating schedule aviators.'},
'X.N.ied':{c:'Intermittent Explosive Disorder: recurrent behavioral outbursts representing failure to control aggressive impulses. Grossly out of proportion to provocation. ≥2x/week for 3 months, or ≥3 episodes in 12 months.',p:["Have you had recurrent episodes of aggressive outbursts — verbal or physical — way out of proportion to the situation?","How frequent are these, and how do you feel about them afterward?"],am:'IED has direct crew safety and CRM implications. Physical aggression in a military context may have legal and administrative consequences affecting clearance and suitability.'},
'X.N.gam':{c:'Gambling Disorder: persistent and recurrent problematic gambling causing significant impairment. ≥4 of 9 criteria.',p:["Tell me about your gambling — what you do, how often, how much.","Have you tried to cut back or stop and found it difficult?","Have you lied to others about the extent of your gambling?","Has gambling created financial problems?"],am:'Gambling disorder has significant security clearance implications — financial compromise, debt, and associated lying behavior are adjudicative concerns.'},
'X.N.other':{c:'Other behavioral addictions: internet gaming disorder, hypersexual behavior, compulsive buying. Below formal DSM threshold but clinically significant patterns.',p:["Are there other behaviors — gaming, sexual activity, shopping — you engage in compulsively and have tried to cut back without success?"],am:''},
'X.O.sub':{c:'Subjective cognitive complaints: self-reported difficulties in memory, attention, processing speed, word-finding, executive function.',p:["Have you noticed any changes in your memory, concentration, or mental sharpness?","Are there specific cognitive tasks that feel harder than they used to?","Have others noticed any changes in your mental functioning?"],am:'Subjective cognitive complaints in an aviator warrant thorough evaluation. Cockpit-specific impacts are the key aeromedical question.'},
'X.O.tbi':{c:'TBI history: all incidents with loss of consciousness, post-traumatic amnesia, or altered mental status. Severity classification and symptom trajectory.',p:["Walk me through every head injury you've had — sports, falls, accidents, blast exposure, training incidents.","For each: was there any loss of consciousness? How long? Any amnesia around it? Any persistent symptoms?"],am:'Cumulative TBI burden is aeromedically significant even when individual events appear mild. Contact sports, blast exposure, and training incidents must all be documented.'},
'X.O.hyp':{c:'Hypoxic and physiologic exposures: sudden decompression events, altitude chamber incidents, G-LOC history, toxic exposures.',p:["Have you ever had a G-LOC — loss of consciousness under G forces?","Have you had any hypoxia events — in the altitude chamber or in flight?"],am:'Each hypoxic event must be individually documented. Repeated G-LOC events suggest potential for future incapacitation and require specific aeromedical evaluation.'},
'X.O.mncd':{c:'Mild Neurocognitive Disorder: modest cognitive decline from previous level in ≥1 domains. Does not interfere with independence in everyday activities.',p:["Have there been documented declines in cognitive testing compared to previous baseline?","Is there a progression of cognitive difficulties over time?"],am:'MND in an aviator warrants ACS evaluation. Even mild deficits may significantly affect complex aviation task performance.'},
'X.O.mncd2':{c:'Major Neurocognitive Disorder: significant cognitive decline in ≥1 domains, interfering with independence. Multiple etiologies.',p:["Is there documented significant cognitive decline interfering with independence in daily activities?","What is the pattern and progression of symptoms?"],am:'Major NCD is disqualifying for all flying classes.'},
'XI.1':{c:'Appearance: grooming, dress, hygiene, apparent vs. actual age. Behavior: cooperation, eye contact, psychomotor activity, rapport.',p:["Observe: Is dress and grooming appropriate and consistent with stated functioning?","Is there psychomotor agitation (restlessness, hand-wringing) or retardation (slowed movement)?"],am:'Military bearing and apparent effort to present positively may mask underlying pathology. Note explicitly if presentation seems managed or performed.'},
'XI.2':{c:'Psychomotor: rate and quality of movement. Agitation vs. retardation.',p:["Observe: Rate of movement, latency of responses, posture, motor activity throughout the interview."],am:'Psychomotor retardation is directly relevant to cockpit performance — reaction time and movement fluency.'},
'XI.3':{c:'Speech: rate, rhythm, volume, spontaneity, prosody, coherence.',p:["Observe: Is speech spontaneous or prompted? Rate — fast, pressured, slowed? Volume? Coherent?"],am:''},
'XI.4':{c:'Mood (subjective emotional state) and Affect (observable expression). Range, intensity, lability, congruence with content.',p:["How would you describe your mood right now, and over the past week?","Observe: What emotion is observable? Is it congruent with the topic? Broad or restricted range?"],am:'Dysphoric, labile, or blunted affect in an aviator warrants documentation and consideration of underlying mood disorder.'},
'XI.5':{c:'Thought process: the form of thinking. Logical and goal-directed vs. tangential, circumstantial, loose associations, flight of ideas, thought blocking.',p:["Observe throughout: Does the person answer questions directly, or drift? Does thinking follow a logical sequence?"],am:'Formal thought disorder is incompatible with aviation duties. Even subtle disorganization warrants follow-up.'},
'XI.6':{c:'Thought content: suicidal/homicidal ideation, delusions, obsessions, preoccupations, ideas of reference.',p:["Have you had any thoughts of hurting yourself or others?","Are there persistent thoughts or worries that feel stuck and won't go away?","Do you have any thoughts or beliefs that others have told you don't make sense?"],am:'Any thought content suggesting safety risk triggers immediate aeromedical and clinical action.'},
'XI.7':{c:'Perceptual disturbances: hallucinations, illusions, depersonalization, derealization.',p:["Have you been hearing, seeing, or sensing things that others around you couldn't perceive?","Are your perceptions of yourself and your surroundings feeling real and solid?"],am:'Any frank hallucination in a waking state is immediately disqualifying.'},
'XI.8':{c:'Cognition: orientation, attention/concentration, memory (immediate, recent, remote), fund of knowledge, calculations, abstract reasoning.',p:["What is today's date? Where are we right now?","Observe: Did the person follow complex questions without losing the thread? Were responses appropriately detailed?"],am:'Formal cognitive screening (MoCA) should be administered if any concern arises from the clinical interview.'},
'XI.9':{c:'Insight: awareness and understanding of own mental health situation. Judgment: ability to make sound decisions and act appropriately.',p:["What do you think is going on with you — what's your understanding of why you're here?","If you were back in the cockpit tomorrow and something went wrong, what would you do?"],am:'Poor insight in an aviator is a significant concern for self-grounding compliance and appropriate help-seeking.'},
'XI.10':{c:'Attitude toward evaluation: cooperative, guarded, defensive, hostile, minimizing, exaggerating, motivated, indifferent.',p:["Observe throughout: How forthcoming has the person been? Are there topics met with deflection or irritability?","Is there motivation to return to flying that may be driving the presentation?"],am:'Secondary gain analysis begins here. The aviator\'s strong motivation to return to flying status creates significant response bias — this must be explicitly addressed in the formulation.'},
'XII.1':{c:'Aviation identity and meaning: how central flying is to the aviator\'s sense of self. Loss of aviation identity as stressor or grief response.',p:["How important is flying to who you are — as a person, not just a job?","Has the prospect of losing your flying status been part of what you've been struggling with?","How would you feel about yourself if you were permanently grounded?"],am:'Strong aviation identity can motivate recovery and return — but can also drive minimization and non-disclosure. Both directions matter for formulation.'},
'XII.2':{c:'Performance history: objective data on aviation performance prior to and following the presenting concern. Checkride records, standardization evaluations, commander assessments.',p:["Walk me through your flying performance history — any DQs, pink slips, or negative evaluations?","Has there been any change in your performance since your symptoms began?"],am:'Performance records are collateral data — request and review them. Discrepancies between self-reported performance and objective records are significant.'},
'XII.3':{c:'Cockpit behavior under stress: actual behavior during high-demand, emergency, or novel scenarios. Task saturation responses, decision-making quality, CRM, error patterns.',p:["Tell me about a high-stress or emergency situation in the cockpit — how did you respond?","Have there been situations where you felt overwhelmed, froze, made an error, or made a decision you regretted?","How has your CRM been — how do you work with your crew under pressure?"],am:'Cockpit behavior under stress is the primary aeromedical behavioral indicator. AMRAAM Step 2 risk assessment is anchored here.'},
'XII.4':{c:'Incapacitation and degradation risk: probability and consequences of sudden or gradual incapacitation in flight due to psychiatric factors. Includes suicidal risk using aircraft, in-flight panic, dissociation, flashback, cognitive degradation.',p:["In your worst moments of symptoms — if you were in the cockpit right now — what do you think would happen?","Have you ever had any symptoms during flight that affected your performance or safety?","Is there any part of you that has thought about using an aircraft to harm yourself?"],am:'This is the core AMRAAM aeromedical risk question. Assessment must explicitly consider aircraft-as-means, in-flight panic incapacitation, and cognitive degradation.'},
'XII.5':{c:'Motivation to return to flying: genuine and healthy vs. driven by identity threat, financial pressure, avoidance of treatment, or external pressure.',p:["What does returning to flying mean to you right now?","Is anyone pressuring you to return — command, family, financial concerns?","Are there any reservations or concerns you have about returning to flying?"],am:'Secondary gain analysis intersects here. Pressure to return, minimization of symptoms, and avoidance of consequences all affect validity of self-report.'},
'XII.6':{c:'Insight into aeromedical implications: does the aviator understand how their condition affects flight safety? Do they accept the need for evaluation, treatment, and monitoring?',p:["In your own assessment, do you feel you are currently safe to fly?","What do you understand about how this condition could affect your performance in the cockpit?","Are you committed to the treatment and monitoring that a waiver would require?"],am:'Poor aeromedical insight is itself a significant risk factor. An aviator who does not connect symptoms to flight safety may not self-ground appropriately or comply with aftercare requirements.'},
'XIII.1':{c:'Response style summary: overall validity and reliability of self-report throughout the evaluation. Consistent? Forthcoming or guarded? Effort on testing?',p:["Synthesize across the full evaluation: Are the person's accounts consistent across different parts of the interview?","Do test results and behavioral observations support or contradict self-report?"],am:''},
'XIII.2':{c:'Consistency analysis: comparisons across time (current vs. prior reports), source (self vs. collateral), and domain (behavioral history vs. current claims).',p:["Are current accounts consistent with what is documented in prior records?","Are there significant discrepancies between self-report and collateral information from supervisors, peers, or family?","Does the clinical picture across all sources hang together coherently?"],am:'Inconsistency does not automatically indicate malingering — it may also reflect memory distortion, shame, or poor insight. Each inconsistency must be characterized.'},
'XIII.3':{c:'Secondary gain analysis: what does the aviator gain (or avoid) from the evaluation outcome? Return to flying, avoidance of administrative consequences, disability, medications.',p:["What happens to this person if cleared vs. not cleared?","Is there pressure — financial, identity, command — driving the motivation to return?","Is there anything to be gained from remaining on DNIF status?"],am:'Secondary gain in either direction — toward returning or staying grounded — affects response validity. The aeromedical evaluation creates powerful incentive structures that must be explicitly analyzed.'},
'XIII.4':{c:'Effort and engagement during the evaluation: cooperation, effort on cognitive testing, consistency of presentation, engagement with the process.',p:["Throughout the evaluation: Did the person engage genuinely with the process?","Were there signs of sub-optimal effort on testing?","Was the person forthcoming or did they require significant prompting?"],am:'Formal performance validity testing (PVTs) should be incorporated in evaluations where effort is in question.'},
'XIII.5':{c:'Collateral integration: how does self-reported picture align with collateral information from records, supervisors, commanders, peers, and family?',p:["What does the commander say about this aviator's function and character?","What do peers and wingmen report about in-cockpit and off-duty behavior?","Do records support the clinical history the aviator has presented?"],am:'Collateral information is essential in forensic aeromedical evaluations. The AMRAAM specifically requires collateral assessment. Discrepancies between self-report and collateral require explicit documentation and resolution in the formulation.'},
'XIV.1':{c:'Current stressors: active stressors across life domains — work, relationships, financial, legal, medical, operational.',p:["What are the main stressors in your life right now?","How long have they been active?","Which ones feel most out of your control?"],am:'Stressor load directly informs adjustment disorder diagnosis and differential. Cumulative stressor burden affects resilience and performance.'},
'XIV.2':{c:'Coping repertoire: healthy and unhealthy coping strategies. Adaptive (exercise, social support, help-seeking) vs. maladaptive (substance use, avoidance, isolation, risk-taking).',p:["When things get difficult, what do you typically do to manage?","Is alcohol or substance use part of how you cope?","What helps, and what makes things worse?"],am:''},
'XIV.3':{c:'Resilience factors: previous recovery from adversity, support systems, meaning-making capacity, flexibility under stress, access to help.',p:["Tell me about a previous time you went through something difficult — how did you get through it?","What resources do you have — people, activities, beliefs — that have helped you in hard times?"],am:'Resilience factors are protective and prognostically important. AMRAAM Step 2 explicitly includes protective factor assessment.'},
'XIV.4':{c:'Strengths and assets: professional competencies, character strengths, work ethic, social skills, problem-solving ability, leadership capacity.',p:["What do you do well — professionally and personally?","What have your supervisors and peers consistently recognized as your strengths?"],am:'Strengths are relevant to the AMRAAM formulation and the waiver recommendation — part of the overall risk-benefit picture.'},
'XIV.5':{c:'Financial and legal history: significant debt, bankruptcy, legal violations, disciplinary actions, civil litigation.',p:["How are your finances right now — any significant debt, financial stress, or problems?","Have you ever had any legal involvement — arrests, civil suits, disciplinary actions?"],am:'Financial problems are both a stressor and a security clearance concern. Legal history is directly relevant to ARMA and character evaluation.'},
'XIV.6':{c:'Cultural factors: cultural background, cultural influences on symptom expression, help-seeking behavior, and evaluation relationship.',p:["How does your cultural background shape how you think about mental health and seeking help?","Are there ways your culture or community influences how you understand what you're going through?"],am:''},
'XV.1':{c:'Record review protocol: systematic review of all available records prior to the session. Includes prior mental health evaluations, medical records, personnel records, flight records, legal documents, and command information.',p:['What records have been received and reviewed? Which are missing?','Are there prior mental health evaluations — what were the diagnoses and recommendations?','Is there a prior waiver history — what was the basis and what has changed?','What do the flight records and standardization evaluations show?'],am:'Record review is the foundation of a credible aeromedical evaluation. Gaps in the record should be documented explicitly — missing records are clinically significant.'},
'XV.2':{c:'BQ gap analysis: identification of background questionnaire items that were not completed, were answered ambiguously, or require clinical follow-up during the session.',p:['Which BQ items were left blank or answered with "none" in a way that warrants follow-up?','Are there inconsistencies between BQ responses and the referral narrative?','What childhood and developmental items need elaboration?'],am:''},
'XV.3':{c:'Case-specific question generation: tailoring the interview to the specific referral question, diagnosis, and clinical history. What does this case most require?',p:['What are the two or three most critical questions this evaluation must answer?','What clinical hypotheses need to be confirmed or disconfirmed?','What is the most likely diagnosis, and what is the most important differential?'],am:''},
'XV.4':{c:'Thread-watch list: topics, inconsistencies, or observations flagged for active tracking during the session. Things that need to come back around.',p:['What threads from the record or BQ need active follow-up during the interview?','What inconsistencies require resolution?','What behavioral or relational patterns need longitudinal confirmation?'],am:''},
'XV.5':{c:'Testing integration: psychological and neuropsychological testing completed prior to or planned for this evaluation. Results to be integrated with clinical interview.',p:['What testing has been completed — MMPI, PAI, neuropsychological battery, cognitive screen?','Are there performance validity concerns based on testing results?','What do the test results suggest about diagnosis, character, and response style?'],am:'Formal psychological testing is strongly recommended for all aeromedical evaluations. Performance validity testing (PVTs) should be incorporated when effort is in question.'},
'XV.6':{c:'Session planning: structure and sequencing of the interview. Which domains are highest priority? What is the opening strategy? How will sensitive topics be approached?',p:['What is the planned sequence for this evaluation?','What is the strategy for approaching the most sensitive material?','How long is the session, and what must be completed?'],am:''},
'I.1':{c:'Response style: overall cooperativeness, openness, guardedness, defensiveness, or minimization across the evaluation. Is the person forthcoming or requiring significant prompting?',p:['Observe throughout: Is the person answering questions directly or deflecting?','Is there a pattern of minimization — things being framed as less significant than they likely are?','Does the level of disclosure match what would be expected given the referral concern?'],am:'Response style is the lens through which all other data must be interpreted. Strong motivation to return to flying status creates consistent pressure toward minimization. Note this explicitly in the formulation.'},
'I.2':{c:'Credibility indicators: consistency of account across time and domains, appropriate affect for content, level of detail, spontaneous disclosure vs. prompted disclosure, internal coherence.',p:['Is the account internally consistent — do details align across different parts of the interview?','Is the affect appropriate for the content being described?','Are there spontaneous disclosures that go beyond what was asked, suggesting genuine engagement?'],am:'Credibility is not binary. Document specific examples of consistent or inconsistent reporting. Appropriate shame, guilt, or distress when discussing difficult material is a positive credibility indicator.'},
'I.3':{c:'Secondary gain analysis: what does this person stand to gain or lose from the evaluation outcome? Return to flying, avoidance of administrative consequences, disability, medical separation, medication access, or sympathy.',p:['What are the stakes of this evaluation for this person?','Is there pressure — command, financial, family, identity — driving the motivation to return to flying?','Is there anything to be gained from remaining grounded — avoidance of consequences, lighter duties, sympathy?'],am:'Secondary gain operates in both directions — toward return to flying AND toward remaining grounded. Both must be explicitly analyzed. The incentive structure of an aeromedical evaluation is powerful and must be named.'},
'I.4':{c:'Evaluation relationship observations: quality of rapport, transference reactions (how the person relates to the evaluator), countertransference (what the evaluator notices in themselves). Initial and evolving.',p:['How does the person relate to the evaluator — deferential, challenging, engaging, guarded, seductive, entitled?','How does the evaluator feel in the room — engaged, bored, anxious, manipulated, sympathetic?','Does the relational style observed in session match the patterns described in the history?'],am:'Countertransference is clinical data. An evaluator who feels manipulated, unusually sympathetic, or dismissive should examine whether the relational dynamic reflects the clinical picture.'},
'II.1':{c:'Referral context: who initiated the referral, on what basis, and what specific question is being asked of this evaluation. Command vs. self-referral. Voluntary vs. compelled.',p:['Tell me how you came to be here today — who initiated this evaluation?','Was this voluntary on your part, or were you directed to come?','What do you understand to be the specific question this evaluation is trying to answer?'],am:'Self-referral typically indicates better insight and motivation for treatment. Command-directed referral places the clinician in a dual-agent role — be explicit about this with the aviator.'},
'II.2':{c:'Chief complaint and narrative: the person\'s own account of what has been happening, in their own words and with their own framing. What do they say is the problem?',p:['Tell me in your own words what has been going on — what brought you to this point?','How long has this been a concern?','What do you think is at the root of what you\'ve been experiencing?'],am:'The chief complaint narrative reveals the person\'s explanatory model, their insight, their relationship to the presenting concern, and implicitly their secondary gain orientation. Listen for what is emphasized, minimized, or omitted.'},
'II.3':{c:'Timeline construction: precise chronological sequence of the presenting concern. Onset, course, precipitants, exacerbating and remitting factors, treatment response, and current status.',p:['Walk me through the timeline — when did things first start, and what happened next?','What was the first sign that something was different?','Have there been periods when things improved? What was happening then?'],am:'The timeline is the skeleton of the clinical formulation. Probe for gaps, accelerations, and the relationship between life events and symptom change.'},
