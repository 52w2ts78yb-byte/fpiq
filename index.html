// ── FINDINGS EXPORT ───────────────────────────────────
function generateFindings(cd, sessionIdx) {
  const rq = REFERRAL_QUESTIONS.find(r => r.id === cd.referralId);
  const lines = [];
  const date = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

  // Determine which coverage map to use
  const sessions = cd.sessions || [];
  let coverage, prevCoverage, sessionLabel;

  if (sessionIdx === null || sessionIdx === undefined || sessions.length === 0) {
    // Current cumulative state
    coverage = cd.coverage;
    prevCoverage = null;
    sessionLabel = 'Current (all sessions)';
  } else {
    const s = sessions[sessionIdx];
    coverage = s.snapshot || cd.coverage;
    const prev = sessionIdx > 0 ? sessions[sessionIdx - 1] : null;
    prevCoverage = prev ? (prev.snapshot || {}) : {};
    sessionLabel = 'S' + s.n + '  (' + fmtDate(s.date) + ')';
  }

  lines.push('FPIQ FINDINGS SUMMARY');
  lines.push('='.repeat(52));
  lines.push('Case:     ' + cd.code);
  lines.push('Referral: ' + (rq ? rq.label : 'Not specified'));
  lines.push('View:     ' + sessionLabel);
  if (sessions.length > 0) lines.push('Sessions: ' + sessions.length + ' logged');
  lines.push('Date:     ' + date);
  lines.push('');

  // Collect items with states, and optionally delta vs previous session
  const positive = [], negative = [], unresolved = [], flagged = [];

  DOMAINS.forEach(dom => {
    dom.items.forEach(it => {
      const state = coverage[it.id] || '○';
      const thr   = cd.threads[it.id];
      let label = dom.code + ' · ' + it.label;

      // Delta marker vs previous session
      if (prevCoverage !== null) {
        const prev = prevCoverage[it.id] || '○';
        if (state !== prev && state !== '○') label += '  [new: was ' + prev + ']';
        if (state === '○' && prev !== '○') return; // dropped — skip
      }

      if (thr && thr.flagged) flagged.push({ label, note: thr.note || '' });
      if (state === '+' || state === '✓' || state === '⚑') positive.push(label);
      else if (state === '-') negative.push(label);
      else if (state === '~') unresolved.push(label);
    });
  });

  lines.push('POSITIVE FINDINGS (' + positive.length + ')');
  lines.push('-'.repeat(40));
  if (positive.length === 0) lines.push('  None marked positive.');
  positive.forEach(l => lines.push('  + ' + l));
  lines.push('');

  lines.push('UNRESOLVED / INDETERMINATE (' + unresolved.length + ')');
  lines.push('-'.repeat(40));
  if (unresolved.length === 0) lines.push('  None.');
  unresolved.forEach(l => lines.push('  ~ ' + l));
  lines.push('');

  lines.push('NEGATIVE / NOT PRESENT (' + negative.length + ')');
  lines.push('-'.repeat(40));
  if (negative.length === 0) lines.push('  None marked negative.');
  negative.forEach(l => lines.push('  \u2212 ' + l));
  lines.push('');

  if (flagged.length > 0) {
    lines.push('FLAGGED THREADS (' + flagged.length + ')');
    lines.push('-'.repeat(40));
    flagged.forEach(f => {
      lines.push('  \u2691 ' + f.label);
      if (f.note) lines.push('      ' + f.note);
    });
    lines.push('');
  }

  if ((cd.freeThreads || []).length > 0) {
    lines.push('FREE-TEXT THREADS');
    lines.push('-'.repeat(40));
    cd.freeThreads.forEach(ft => lines.push('  \u21aa ' + ft.text));
    lines.push('');
  }

  // Diagnostic threshold summary
  const thrLines = [];
  Object.keys(THRESHOLDS).forEach(domId => {
    const tr = computeThreshold(domId, coverage);
    if (!tr) return;
    const dom = DOMAINS.find(d => d.id === domId);
    const name = dom ? dom.name : domId;
    if (tr.type === 'cluster') {
      if (tr.metCount > 0) {
        const badges = tr.results.map(r => r.id + (r.ok ? '\u2713' : ' ' + r.met + '/' + r.need)).join(' ');
        thrLines.push('  ' + name + ': ' + badges + (tr.allMet ? '  [THRESHOLD MET]' : ''));
      }
    } else {
      if (tr.met > 0) {
        const gw = tr.gateOk ? '' : '  [gate not met]';
        thrLines.push('  ' + name + ': ' + tr.met + '/' + tr.need + gw + (tr.fullMet ? '  [THRESHOLD MET]' : ''));
      }
    }
  });
  if (thrLines.length > 0) {
    lines.push('DIAGNOSTIC THRESHOLD SUMMARY');
    lines.push('-'.repeat(40));
    thrLines.forEach(l => lines.push(l));
    lines.push('');
  }

  lines.push('\u2500'.repeat(52));
  lines.push('Generated by FPIQ v1.20260627');
  return lines.join('\n');
}

// ── DIFFERENTIAL PANEL ───────────────────────────────
function DifferentialPanel({ coverage, onClose }) {
  const diff = useMemo(() => computeDifferential(coverage), [coverage]);
  const top2 = diff.filter(d => d.score > 0).slice(0, 2).map(d => d.domId);
  const discKey = top2.length === 2 ? pairKey(top2[0], top2[1]) : null;
  const discriminator = discKey ? DISCRIMINATORS[discKey] : null;

  const barColor = (d) => {
    if (d.fullMet) return C.posGreen;
    if (d.score >= 0.6) return C.incAmber;
    if (d.score > 0) return C.accent;
    return C.border;
  };

  const domLabel = domId => {
    const dom = DOMAINS.find(d => d.id === domId);
    return dom ? `${dom.code} · ${dom.name}` : domId;
  };

  return h('div', { style: { position: 'absolute', bottom: 0, left: 0, right: 0, height: '62%', background: C.s2, borderTop: `2px solid ${C.accentBdr}`, display: 'flex', flexDirection: 'column', zIndex: 50 } },

    // Header
    h('div', { style: { padding: '10px 14px', borderBottom: `1px solid ${C.border}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: C.s1, flexShrink: 0 } },
      h('div', {},
        h('span', { style: { fontSize: 13, fontWeight: 500, color: C.accent, fontFamily: 'monospace' } }, '\u0394  Differential hierarchy'),
        h('span', { style: { marginLeft: 10, fontSize: 10, color: C.txtMut } }, '+ criteria marked positive \u00b7 ~ unresolved')
      ),
      h('button', { onClick: onClose, style: { background: 'none', border: 'none', cursor: 'pointer', color: C.txtMut, fontSize: 20, padding: '0 6px', lineHeight: 1 } }, '\u00d7')
    ),

    // Discriminator banner
    discriminator && h('div', { style: { padding: '8px 14px', borderBottom: `1px solid ${C.border}`, background: C.accentBg, flexShrink: 0 } },
      h('div', { style: { fontSize: 9, fontWeight: 700, color: C.accent, letterSpacing: '0.08em', marginBottom: 3 } }, 'KEY DISCRIMINATOR \u2014 TOP 2'),
      h('div', { style: { fontSize: 11, color: C.txt, lineHeight: 1.55 } }, discriminator)
    ),

    // Ranked list
    h('div', { style: { flex: 1, overflowY: 'auto', padding: '6px 0' } },
      diff.length === 0
        ? h('div', { style: { padding: 24, color: C.txtMut, fontSize: 13, textAlign: 'center' } }, 'No diagnostic criteria marked yet. Mark items + in domain panels to populate the differential.')
        : diff.map((d, idx) => {
          const barW = Math.round(d.score * 100);
          const color = barColor(d);
          const isTop = idx < 2 && d.score > 0;
          return h('div', { key: d.domId, style: { padding: '7px 14px', borderBottom: `1px solid ${C.bg}`, background: isTop ? 'rgba(59,187,204,0.04)' : 'transparent' } },
            h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, marginBottom: 5 } },
              h('span', { style: { fontSize: 10, fontFamily: 'monospace', color: C.txtMut, minWidth: 16, flexShrink: 0 } }, (idx + 1) + '.'),
              h('span', { style: { fontSize: 12, color: d.fullMet ? C.posGreen : d.score > 0 ? C.txt : C.txtMut, fontWeight: d.fullMet ? 600 : 400, flex: 1 } }, domLabel(d.domId)),
              d.fullMet && h('span', { style: { fontSize: 9, background: C.posBg, color: C.posGreen, border: '1px solid rgba(72,187,120,0.27)', borderRadius: 3, padding: '1px 5px', fontFamily: 'monospace', fontWeight: 700, flexShrink: 0 } }, 'MET'),
              d.indeterminate > 0 && h('span', { style: { fontSize: 9, background: C.incBg, color: C.incAmber, borderRadius: 3, padding: '1px 5px', fontFamily: 'monospace', flexShrink: 0 } }, '~' + d.indeterminate + ' unresolved'),
              h('span', { style: { fontSize: 10, fontFamily: 'monospace', color: C.txtSec, flexShrink: 0 } }, d.display)
            ),
            h('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
              h('div', { style: { flex: 1, height: 4, background: C.bg, borderRadius: 2, overflow: 'hidden' } },

              )
            ),
            d.thresh.type === 'cluster' && h('div', { style: { display: 'flex', gap: 5, marginTop: 4, flexWrap: 'wrap' } },
              ...d.thresh.results.map(r => h('span', { key: r.id, style: { fontSize: 9, fontFamily: 'monospace', padding: '1px 5px', borderRadius: 3, background: r.ok ? C.posBg : C.bg, color: r.ok ? C.posGreen : C.txtMut, border: '1px solid ' + (r.ok ? 'rgba(72,187,120,0.27)' : C.border) } },

  const [showWG,       setShowWG]       = useState(false);
  const [showDiff,     setShowDiff]     = useState(false);
  const [showFindings, setShowFindings] = useState(false);
  const [showPrompt,   setShowPrompt]   = useState(false);
  const [showImport,   setShowImport]   = useState(false);
  const [showMenu,     setShowMenu]     = useState(false);
  const [expNote,  setExpNote]  = useState(null);
  const [newThr,   setNewThr]   = useState('');
  const [saving,   setSaving]   = useState(false);
  const timer = useRef(null);
  const cd = caseData;

  // Auto-save (localStorage is synchronous but we debounce UI indicator)
  useEffect(() => {
    setSaving(true);
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(() => {
      LS.set(`fpiq:${cd.id}`, { ...cd, updated: new Date().toISOString() });
      setSaving(false);
    }, 800);
    return () => clearTimeout(timer.current);
  }, [cd]);

  const upd     = useCallback(p => onUpdate(prev => ({ ...prev, ...p })), [onUpdate]);
  const cycle   = useCallback((id, ev) => onUpdate(prev => {
    const cy  = ev ? EV_CYCLES : CR_CYCLES;
    const cur = prev.coverage[id] || '○';
    const nxt = cy[(cy.indexOf(cur) + 1) % cy.length];
    return { ...prev, coverage: { ...prev.coverage, [id]: nxt } };
  }), [onUpdate]);
  const setFlag    = useCallback((id, f) => onUpdate(prev => {
    const ex = prev.threads[id] || { flagged: false, note: '' };
    return { ...prev, threads: { ...prev.threads, [id]: { ...ex, flagged: f } } };
  }), [onUpdate]);
  const setThrNote = useCallback((id, note) => onUpdate(prev => {
    const ex = prev.threads[id] || { flagged: false, note: '' };
    return { ...prev, threads: { ...prev.threads, [id]: { ...ex, note } } };
  }), [onUpdate]);
  const setEvNote  = useCallback((id, note) => onUpdate(prev => ({ ...prev, evalNotes: { ...prev.evalNotes, [id]: note } })), [onUpdate]);
  const addFree    = () => {
    if (!newThr.trim()) return;
    onUpdate(prev => ({ ...prev, freeThreads: [...(prev.freeThreads || []), { id: `ft${Date.now()}`, text: newThr.trim(), created: new Date().toISOString() }] }));

  const addSession = () => onUpdate(prev => ({
    ...prev,
    sessions: [...prev.sessions, {

        style: { ...btn(false), flexShrink: 0, whiteSpace: 'nowrap' }
      }, `+ S${cd.sessions.length + 1}`),
      h('button', {
        onClick: () => { setShowThr(s => !s); setOpenDom(null); },
        style: { ...btn(showThr || thrCount > 0, C.flag), flexShrink: 0, whiteSpace: 'nowrap' }
      }, `⚑ ${thrCount}`)
    ),

    // ── Legend ──────────────────────────────────────
    h('div', { style: { background: C.bg, borderBottom: `1px solid ${C.s1}`, padding: '4px 14px', display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0, flexWrap: 'wrap', fontSize: 10, color: C.txtMut } },
      h('span', { style: { fontWeight: 600 } }, 'Criterion:'),
      ...CR_CYCLES.map(s => h('span', { key: s, style: { display: 'flex', alignItems: 'center', gap: 3 } },
        h('span', { style: { width: 15, height: 15, borderRadius: 3, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'monospace', fontWeight: 700, fontSize: 10, ...CR[s].style } }, s),
        CR[s].label.split(' ')[0]
      )),
      h('span', { style: { fontWeight: 600, marginLeft: 6 } }, 'Evaluative:'),
      ...EV_CYCLES.map(s => h('span', { key: s, style: { display: 'flex', alignItems: 'center', gap: 3 } },
        h('span', { style: { width: 15, height: 15, borderRadius: 3, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'monospace', fontWeight: 700, fontSize: 10, ...EV[s].style } }, s),
        EV[s].label.split(' ')[0].split('\u2014')[0].trim()
      )),
      h('span', { style: { fontWeight: 600, marginLeft: 6, color: C.flag } }, 'PS'),
      h('span', { style: { color: C.txtMut } }, '= pre-session import')
    ),

    // ── Body ────────────────────────────────────────
    h('div', { style: { flex: 1, display: 'flex', overflow: 'hidden', position: 'relative' } },

      // Domain grid
      h('div', { style: { flex: 1, overflowY: 'auto', padding: 10, minWidth: 0 } },
        cd.referralId && h('div', { style: { marginBottom: 8, padding: '5px 10px', background: C.accentBg, borderRadius: 6, fontSize: 11, color: C.accent, display: 'flex', gap: 8 } },
          h('span', { style: { fontWeight: 600 } }, 'Priority:'),
          h('span', { style: { opacity: 0.8 } }, '2px border = primary  ·  thin = secondary')
        ),
        h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(124px, 1fr))', gap: 6 } },
          ...DOMAINS.map(dom => {
            const cts   = getCts(dom);
            const total = dom.items.length;
            const addr  = total - cts['○'];
            const pri   = getPri(dom.id);
            const isOpen = openDom?.id === dom.id;
            const pos = cts['+'] + cts['✓'];
            const neg = cts['-'];
            const inc = cts['~'] + cts['⚑'];
            const thresh = computeThreshold(dom.id, cd.coverage);
            const threshMet   = thresh && (thresh.type === 'cluster' ? thresh.allMet : thresh.fullMet);
            const threshClose = thresh && !threshMet && (thresh.type === 'cluster' ? thresh.metCount > 0 : thresh.close);
            const isPSPriority = (cd.presessionPriority || []).includes(dom.id);
            const fullyCleared = total > 0 && addr === total && pos === 0 && inc === 0;
            const probeItems = dom.items.filter(it => (cd.presessionProbes || {})[it.id]);
            const psState = probeItems.length === 0 ? null :
                            probeItems.some(it => (cd.coverage[it.id] || '○') === '○') ? 'active' :
                            probeItems.some(it => cd.coverage[it.id] === '~') ? 'inconclusive' :
                            'resolved';

            // Border: threshold state overrides priority if stronger; fully-cleared (all negative) overrides priority too
            const borderStyle = threshMet    ? `2px solid ${C.posGreen}` :
                                threshClose  ? `2px solid ${C.incAmber}` :
                                fullyCleared ? `2px solid ${C.clearedBorder}` :
                                pri === 'primary'   ? `2px solid ${C.priPrimary}` :
                                pri === 'secondary' ? `1px solid ${C.priSecondary}` :
                                isPSPriority ? `2px solid ${C.flag}` :
                                `1px solid ${C.border}`;

            const bgStyle = isOpen      ? C.accentBg :
                            threshMet   ? 'rgba(72,187,120,0.08)' :
                            threshClose ? 'rgba(237,137,54,0.06)' :
                            fullyCleared ? C.clearedBg :
                            isPSPriority ? 'rgba(246,173,85,0.06)' : C.s1;

            return h('div', {
              key: dom.id,
              onClick: () => { setOpenDom(isOpen ? null : dom); setShowThr(false); setShowWG(false); },
              style: {
                background: bgStyle,
                border: borderStyle,
                borderRadius: 8,
                padding: '9px 9px 7px',
                cursor: 'pointer',
                display: 'flex', flexDirection: 'column', gap: 5,
                minHeight: 80,
                transition: 'background 0.12s',
              }
            },
              h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 3 } },
                h('div', { style: { display: 'flex', alignItems: 'center', gap: 3 } },
                  h('span', { style: { fontFamily: 'monospace', fontSize: 9, color: C.txtMut, fontWeight: 600 } }, dom.code),
                  dom.ev && h('span', { style: { fontSize: 7, background: 'rgba(183,148,244,0.18)', color: '#b794f4', borderRadius: 2, padding: '0 3px', fontFamily: 'monospace', fontWeight: 600 } }, 'EV'),
                  psState && h('span', {
                    title: psState === 'active' ? 'Has case-specific probes from pre-session import — not yet addressed'
                         : psState === 'inconclusive' ? 'Pre-session probes addressed, but left inconclusive'
                         : 'Pre-session probes addressed',
                    style: {
                      fontSize: 7, borderRadius: 2, padding: '0 3px', fontFamily: 'monospace', fontWeight: 700,
                      background: psState === 'active' ? C.flagBg : psState === 'inconclusive' ? C.incBg : 'transparent',
                      color: psState === 'active' ? C.flag : psState === 'inconclusive' ? C.incAmber : C.txtMut,
                      border: `1px solid ${psState === 'active' ? C.flagBdr : psState === 'inconclusive' ? C.incAmber + '44' : C.border}`,
                    }
                  }, 'PS')
                ),
                h('div', { style: { display: 'flex', gap: 2, flexWrap: 'wrap', justifyContent: 'flex-end' } },
                  ...dom.tags.slice(0, 2).map(t => h(Tag, { key: t, tag: t }))
                )
              ),
              h('div', { style: { fontSize: 11, fontWeight: 500, color: fullyCleared ? C.txtMut : C.txt, lineHeight: 1.3, flex: 1 } }, dom.name),
              // Threshold indicator
              thresh && h('div', { style: { display: 'flex', gap: 3, alignItems: 'center', flexWrap: 'wrap' } },
                thresh.type === 'cluster'
                  ? thresh.results.map(r => h('span', { key: r.id, style: { fontSize: 9, fontFamily: 'monospace', fontWeight: 700, color: r.ok ? C.posGreen : C.txtMut, background: r.ok ? 'rgba(72,187,120,0.15)' : 'transparent', borderRadius: 3, padding: '0 3px' } }, r.id + (r.ok ? '✓' : `${r.met}/${r.need}`)))
                  : h('span', { style: { fontSize: 9, fontFamily: 'monospace', fontWeight: 700, color: threshMet ? C.posGreen : threshClose ? C.incAmber : C.txtMut } },
                      threshMet ? `✓ ${thresh.need}/${thresh.need}` : `${thresh.met}/${thresh.need}${!thresh.gateOk ? ' ·gate' : ''}`)
              ),
              h('div', { style: { display: 'flex', alignItems: 'center', gap: 5 } },
                h('span', { style: { fontSize: 9, fontFamily: 'monospace', color: C.txtMut, flexShrink: 0 } }, `${addr}/${total}`),
                h('div', { style: { flex: 1, height: 3, borderRadius: 2, background: C.bg, display: 'flex', overflow: 'hidden' } },
                  pos > 0 && h('div', { style: { width: `${(pos / total) * 100}%`, background: threshMet ? C.posGreen : C.accent, opacity: 0.8 } }),
                  neg > 0 && h('div', { style: { width: `${(neg / total) * 100}%`, background: C.negGray, opacity: 0.8 } }),
                  inc > 0 && h('div', { style: { width: `${(inc / total) * 100}%`, background: C.incAmber, opacity: 0.8 } })
                )
              )
            );
          })
        )
      ),

      // Detail panel (sidebar — no absolute positioning)
      openDom && !showWG && h('div', { style: { width: '50%', flexShrink: 0, display: 'flex', flexDirection: 'column', borderLeft: `1px solid ${C.border}`, background: C.s2, minWidth: 300, maxWidth: 560 } },
        h('div', { style: { padding: '10px 14px', borderBottom: `1px solid ${C.border}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: C.s1, flexShrink: 0 } },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, overflow: 'hidden' } },
            h('span', { style: { fontFamily: 'monospace', fontSize: 10, color: C.txtMut } }, openDom.code),
            h('span', { style: { fontSize: 13, fontWeight: 600, color: C.txt, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, openDom.name),
            openDom.ev && h('span', { style: { fontSize: 8, background: 'rgba(183,148,244,0.18)', color: '#b794f4', borderRadius: 3, padding: '1px 5px', fontFamily: 'monospace', fontWeight: 600, flexShrink: 0 } }, 'EVALUATIVE')
          ),
          h('button', { onClick: () => setOpenDom(null), style: { background: 'none', border: 'none', cursor: 'pointer', color: C.txtMut, fontSize: 20, padding: '0 4px', lineHeight: 1 } }, '×')
        ),
        h('div', { style: { fontSize: 10, color: C.txtMut, padding: '5px 14px', borderBottom: `1px solid ${C.s1}`, flexShrink: 0 } },
          openDom.ev ? 'Tap badge: ○ → ✓ → ⚑  ·  ✎ for observation  ·  ⚑ to flag' : 'Tap badge: ○ → + → − → ~  ·  ✎ for note  ·  ⚑ to flag'
        ),
        h('div', { style: { flex: 1, overflowY: 'auto' } },
          ...openDom.items.map(it => h(ItemRow, {
            key: it.id, item: it, ev: openDom.ev,
            state:    cd.coverage[it.id] || '○',
            thr:      cd.threads[it.id]  || { flagged: false, note: '' },
            evNote:   cd.evalNotes[it.id] || '',
            expanded: expNote === it.id,
            presessionProbe: (cd.presessionProbes || {})[it.id] || null,
            onToggle: () => setExpNote(expNote === it.id ? null : it.id),
            onCycle:  () => cycle(it.id, openDom.ev),
            onFlag:   () => setFlag(it.id, !(cd.threads[it.id]?.flagged)),
            onThrNote: note => setThrNote(it.id, note),
            onEvNote:  note => setEvNote(it.id, note),
          }))
        )
      ),

      // Waiver Guide panel (sidebar)
      showWG && cd.referralId && h('div', { style: { width: '50%', flexShrink: 0, display: 'flex', flexDirection: 'column', borderLeft: `1px solid ${C.border}`, minWidth: 300, maxWidth: 560 } },
        h(WaiverGuidePanel, { rqId: cd.referralId, onClose: () => setShowWG(false) })
      ),
      showWG && !cd.referralId && h('div', { style: { width: '50%', flexShrink: 0, display: 'flex', flexDirection: 'column', borderLeft: `1px solid ${C.border}`, background: C.s2, minWidth: 300, maxWidth: 560, padding: 20, alignItems: 'center', justifyContent: 'center' } },
        h('div', { style: { color: C.txtMut, fontSize: 13, textAlign: 'center' } }, 'Select a referral question to view waiver guide.'),
        h('button', { onClick: () => setShowWG(false), style: { marginTop: 12, ...btn(false), fontSize: 12 } }, '× Close')
      ),

      // Differential hierarchy panel (absolute at bottom)
      showDiff && h(DifferentialPanel, { coverage: cd.coverage, onClose: () => setShowDiff(false) }),

      // Thread panel (absolute at bottom)
      showThr && h('div', { style: { position: 'absolute', bottom: 0, left: 0, right: 0, height: '56%', background: C.s2, borderTop: `2px solid ${C.flagBdr}`, display: 'flex', flexDirection: 'column', zIndex: 50 } },
        h('div', { style: { padding: '10px 14px', borderBottom: `1px solid ${C.border}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: C.s1, flexShrink: 0 } },
          h('span', { style: { fontSize: 13, fontWeight: 500, color: C.flag } }, `⚑  Thread watch — ${thrCount} flagged`),
          h('button', { onClick: () => setShowThr(false), style: { background: 'none', border: 'none', cursor: 'pointer', color: C.txtMut, fontSize: 20, padding: '0 6px', lineHeight: 1 } }, '×')
        ),
        h('div', { style: { padding: '8px 14px', borderBottom: `1px solid ${C.border}`, display: 'flex', gap: 8, background: C.bg, flexShrink: 0 } },
          h('input', {
            value: newThr,
            onChange: e => setNewThr(e.target.value),
            onKeyDown: e => e.key === 'Enter' && addFree(),
            placeholder: 'Add free-text thread (Enter to save)…',
            style: { flex: 1, padding: '6px 10px', fontSize: 12, borderRadius: 6, border: `1px solid ${C.border}`, background: C.s1, color: C.txt }
          }),
          h('button', { onClick: addFree, style: { ...btn(true), fontSize: 12 } }, 'Add')
        ),
        h('div', { style: { flex: 1, overflowY: 'auto' } },
          ...(cd.freeThreads || []).map(ft => h('div', { key: ft.id, style: { display: 'flex', alignItems: 'flex-start', gap: 10, padding: '9px 14px', borderBottom: `1px solid ${C.s1}`, background: C.flagBg } },
            h('span', { style: { color: C.flag, fontSize: 14, flexShrink: 0, marginTop: 1 } }, '↪'),
            h('span', { style: { flex: 1, fontSize: 12, color: C.txt, lineHeight: 1.4 } }, ft.text),
            h('span', { style: { fontSize: 10, color: C.txtMut, flexShrink: 0 } }, fmtDate(ft.created)),
            h('button', { onClick: () => delFree(ft.id), style: { background: 'none', border: 'none', cursor: 'pointer', color: C.txtMut, fontSize: 16, padding: '0 4px', flexShrink: 0 } }, '×')
          )),
          ...DOMAINS.flatMap(dom => dom.items.filter(it => cd.threads[it.id]?.flagged).map(it => {
            const thr   = cd.threads[it.id];
            const state = cd.coverage[it.id] || '○';
            return h('div', { key: it.id },
              h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, padding: '8px 14px', borderBottom: `1px solid ${C.s1}` } },
                h(StateBtn, { state, ev: dom.ev, onClick: () => cycle(it.id, dom.ev), size: 24 }),
                h('span', { style: { fontSize: 9, fontFamily: 'monospace', color: C.txtMut, background: C.s1, padding: '2px 6px', borderRadius: 3, flexShrink: 0 } }, dom.code),
                h('span', { style: { flex: 1, fontSize: 12, color: C.txt } }, it.label),
                h('button', { onClick: () => setFlag(it.id, false), style: { background: 'none', border: 'none', cursor: 'pointer', color: C.flag, fontSize: 12, padding: '2px 6px', flexShrink: 0 } }, '× flag')
              ),
              thr.note && h('div', { style: { padding: '3px 14px 8px 54px', fontSize: 11, color: C.txtSec, fontStyle: 'italic' } }, thr.note)
            );
          })),
          thrCount === 0 && h('div', { style: { padding: 24, color: C.txtMut, fontSize: 13, textAlign: 'center' } }, 'No threads flagged. Add a free-text thread above or flag items in the domain panels.')
        )
      )
    ),
    // Findings modal (full-screen overlay)
    showFindings && h(FindingsModal, { cd, onClose: () => setShowFindings(false) }),

    // Prompt modal
    showPrompt && h(PromptModal, { cd, onClose: () => setShowPrompt(false) }),

    // Import modal
    showImport && h(ImportModal, { cd, onApply: updates => { onUpdate(prev => ({ ...prev, ...updates })); }, onClose: () => setShowImport(false) })
  );
}

// ── PASSWORD GATE ─────────────────────────────────────
const APP_PASSWORD = 'fpiq2026';
const AUTH_KEY     = 'fpiq_auth';

function LoginScreen({ onAuth }) {
  const [pw, setPw]   = useState('');
  const [err, setErr] = useState(false);

  const attempt = () => {
    if (pw === APP_PASSWORD) {
      sessionStorage.setItem(AUTH_KEY, '1');
      onAuth();
    } else {
      setErr(true);
      setPw('');
      setTimeout(() => setErr(false), 2000);
    }
  };

  return h('div', { style: { display: 'flex', flexDirection: 'column', height: '100%', alignItems: 'center', justifyContent: 'center', background: C.bg, gap: 16, padding: 32 } },
    h('div', { style: { fontFamily: 'monospace', fontSize: 28, fontWeight: 700, color: C.accent, letterSpacing: '0.08em', marginBottom: 8 } }, 'FPIQ'),
    h('div', { style: { fontSize: 12, color: C.txtMut, marginBottom: 24 } }, 'Forensic Psychiatric Interview'),
    h('input', {
      type: 'password',
      value: pw,
      onChange: e => setPw(e.target.value),
      onKeyDown: e => e.key === 'Enter' && attempt(),
      placeholder: 'Access code',
      autoFocus: true,
      style: { background: C.s1, border: `1px solid ${err ? C.sigRed : C.border}`, borderRadius: 8, padding: '10px 14px', fontSize: 16, color: C.txt, width: '100%', maxWidth: 280, outline: 'none', textAlign: 'center', letterSpacing: '0.15em' }
    }),
    err && h('div', { style: { fontSize: 12, color: C.sigRed } }, 'Incorrect access code'),
    h('button', {
      onClick: attempt,
      style: { ...btn(true), fontSize: 14, padding: '10px 32px', borderRadius: 8, marginTop: 4 }
    }, 'Enter')
  );
}

// ── ROOT APP ──────────────────────────────────────────
function App() {
  const [authed,     setAuthed] = useState(() => !!sessionStorage.getItem(AUTH_KEY));
  const [view,       setView]   = useState('home');
  const [cases,      setCases]  = useState(null);
  const [activeCase, setAC]     = useState(null);

  // Load all cases on startup
  useEffect(() => {
    if (!authed) return;
    const idx    = LS.get('fpiq_index') || [];
    const loaded = idx.map(id => LS.get(`fpiq:${id}`)).filter(Boolean);
    setCases(loaded.sort((a, b) => new Date(b.updated) - new Date(a.updated)));
  }, [authed]);

  const openCase = useCallback(c => {
    const fresh = LS.get(`fpiq:${c.id}`) || c;
    setAC(fresh);
    setView('case');
  }, []);

  const back = useCallback(() => {
    if (activeCase) {
      const fresh = { ...activeCase, updated: new Date().toISOString() };
      LS.set(`fpiq:${fresh.id}`, fresh);
      setCases(prev => {
        const others = (prev || []).filter(c => c.id !== fresh.id);
        return [fresh, ...others].sort((a, b) => new Date(b.updated) - new Date(a.updated));
      });
    }
    setAC(null);
    setView('home');
  }, [activeCase]);

  const onCaseCreated = useCallback(c => {
    setCases(prev => [c, ...(prev || [])]);
    setAC(c);
    setView('case');
  }, []);

  const onCaseDeleted = useCallback(id => {
    setCases(prev => (prev || []).filter(c => c.id !== id));
  }, []);

  const onCaseImported = useCallback(c => {
    // Merge imported case — if id exists, update; otherwise add
    LS.set(`fpiq:${c.id}`, c);
    const idx = LS.get('fpiq_index') || [];
    if (!idx.includes(c.id)) LS.set('fpiq_index', [...idx, c.id]);
    setCases(prev => {
      const others = (prev || []).filter(x => x.id !== c.id);
      return [c, ...others].sort((a, b) => new Date(b.updated) - new Date(a.updated));
    });
  }, []);

  const updateCase = useCallback(updater => {
    setAC(prev => typeof updater === 'function' ? updater(prev) : { ...prev, ...updater });
  }, []);

  if (!authed) return h(LoginScreen, { onAuth: () => setAuthed(true) });

  if (view === 'case' && activeCase) {
    return h(CaseScreen, { caseData: activeCase, onBack: back, onUpdate: updateCase });
  }
  return h(HomeScreen, { cases, onOpen: openCase, onCaseCreated, onCaseDeleted, onCaseImported });
}

createRoot(document.getElementById('app')).render(h(App));
</script>
